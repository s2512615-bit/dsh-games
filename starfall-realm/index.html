    if (room) {
      for (i = 0; i < room.lava.length; i++) {
        var r = room.lava[i];
        var cx = clamp(hero.x, r[0], r[0] + r[2]), cy = clamp(hero.y, r[1], r[1] + r[3]);
        var ld = dist(hero.x, hero.y, cx, cy);
        if (ld < 46) { ux = (hero.x - cx) / Math.max(1, ld); uy = (hero.y - cy) / Math.max(1, ld); }
      }
    }
    var wantX = 0, wantY = 0;
    if (d2 > 96) { wantX = ux; wantY = uy; }
    else if (d2 < 58) { wantX = -ux; wantY = -uy; }
    else { wantX = -uy * 0.7; wantY = ux * 0.7; }
    if (moved < 0.6 && Math.hypot(wantX, wantY) > 0.25) autoStuck.t += dt; else autoStuck.t = 0;
    if (autoStuck.t > 0.45) { autoStuck.t = 0; autoStuck.detour = 0.8; autoStuck.side = autoStuck.side ? -autoStuck.side : 1; }
    if (autoStuck.detour > 0) {
      autoStuck.detour -= dt;
      var wpx = -wantY * autoStuck.side, wpy = wantX * autoStuck.side;
      wantX = wpx; wantY = wpy;
    }
    autoIntent.x = wantX;
    autoIntent.y = wantY;
    if (d2 < 110) doAttack();
    if (d2 < 150 && hero.wwcd <= 0 && hero.mp > R.whirlwindCost + 15) doWhirlwind();
    if (hero.rbcd <= 0 && d2 < 420 && hero.mp > R.retributionCost + 10) doRetribution();
    if (hero.hp < stats.maxHp * 0.45 && hero.potionCd <= 0 && run.potions > 0) doPotion();
    if (stats.ultUnlock && hero.ultcd <= 0 && d2 < 240 && hero.mp > R.ultimateCost + 5) doUltimate();
    // 危险：躲弹
    for (i = 0; i < projectiles.length; i++) {
      var p = projectiles[i];
      if (dist(p.x, p.y, hero.x, hero.y) < 120 && hero.dodgeCd <= 0 && Math.random() < 0.08) doDodge();
    }
    if (target.act === 'windup' && hero.dodgeCd <= 0 && d2 < 170 && Math.random() < 0.1) doDodge();
  }

  /* ============================================================
   * 21. 颜色与几何小工具
   * ============================================================ */
  function hexRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function shade(h, amt) {
    var c = hexRgb(h);
    var f = function (v) { return Math.round(clamp(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt), 0, 255)); };
    return 'rgb(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')';
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }
  function sector(g, x, y, r, a0, a1) {
    g.beginPath();
    g.moveTo(x, y);
    g.arc(x, y, r, a0, a1);
    g.closePath();
  }

  /* ============================================================
   * 22. 静态场景（预渲染一层，换房间时重建）
   * ============================================================ */
  var braziers = [];

  function buildStatic() {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    var act = ACTS[run.act - 1];
    var r2 = mulberry32(staticSeed);
    braziers = [];

    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#04050a');
    bg.addColorStop(0.42, shade(act.tint, -0.55));
    bg.addColorStop(0.75, '#0a0d16');
    bg.addColorStop(1, '#04050a');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
    if (images.background) {
      g.globalAlpha = 0.42;
      g.drawImage(images.background, 0, 0, W, H);
      g.globalAlpha = 1;
    }

    drawBackWall(g, act, r2);
    drawFloor(g, act, r2);
    if (room && room.walls) {
      for (var wi = 0; wi < room.walls.length; wi++) drawWallBlock(g, room.walls[wi], act);
    }
    drawSideWalls(g, act, r2);
    drawFrontEdge(g, act);
    staticLayer = c;
  }

  function drawFloor(g, act, r2) {
    var x, y, i;
    var ax = ARENA.x0, ay = ARENA.y0, aw = ARENA.x1 - ARENA.x0, ah = ARENA.y1 - ARENA.y0;
    g.save();
    g.beginPath(); g.rect(ax, ay, aw, ah); g.clip();

    var base = g.createLinearGradient(0, ay, 0, ARENA.y1);
    base.addColorStop(0, shade(act.tint, -0.7));
    base.addColorStop(0.5, '#1b2130');
    base.addColorStop(1, '#141924');
    g.fillStyle = base;
    g.fillRect(ax, ay, aw, ah);

    // 石砖
    var tw = 68, th = 52;
    for (y = ay; y < ARENA.y1; y += th) {
      var row = Math.floor((y - ay) / th);
      for (x = ax; x < ARENA.x1; x += tw) {
        var v = r2();
        g.fillStyle = 'rgba(' + Math.round(28 + v * 26) + ',' + Math.round(32 + v * 26) + ',' + Math.round(44 + v * 30) + ',0.55)';
        g.fillRect(x + 1, y + 1, tw - 2, th - 2);
        g.strokeStyle = 'rgba(6,8,14,0.65)';
        g.lineWidth = 2;
        g.strokeRect(x + 0.5, y + 0.5, tw - 1, th - 1);
        if (v > 0.86) {
          g.strokeStyle = 'rgba(8,10,16,0.9)';
          g.lineWidth = 1.5;
          g.beginPath();
          g.moveTo(x + tw * 0.2, y + th * 0.2);
          g.lineTo(x + tw * 0.45, y + th * 0.55);
          g.lineTo(x + tw * 0.3, y + th * 0.85);
          g.stroke();
        }
        if (row === 0 && v > 0.5) {
          g.fillStyle = 'rgba(255,236,190,0.05)';
          g.fillRect(x + 4, y + 2, tw - 8, 6);
        }
      }
    }

    // 中央星辉法阵
    var cx = W / 2, cy = ay + ah * 0.56;
    g.save();
    g.translate(cx, cy);
    g.globalCompositeOperation = 'lighter';
    var gl = g.createRadialGradient(0, 0, 10, 0, 0, 250);
    gl.addColorStop(0, rgba(act.tint, 0.30));
    gl.addColorStop(0.5, rgba(act.tint, 0.10));
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gl;
    g.beginPath(); g.ellipse(0, 0, 250, 170, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(190,210,255,0.13)';
    g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, 0, 210, 140, 0, 0, TAU); g.stroke();
    g.beginPath(); g.ellipse(0, 0, 150, 100, 0, 0, TAU); g.stroke();
    for (i = 0; i < 8; i++) {
      var a = (i / 8) * TAU;
      g.beginPath();
      g.moveTo(Math.cos(a) * 150, Math.sin(a) * 100);
      g.lineTo(Math.cos(a) * 210, Math.sin(a) * 140);
      g.stroke();
    }
    g.restore();

    // 碎裂与瓦砾
    for (i = 0; i < 26; i++) {
      var rx = ax + r2() * aw, ry = ay + r2() * ah;
      g.fillStyle = 'rgba(120,132,160,' + (0.04 + r2() * 0.06) + ')';
      g.beginPath();
      g.ellipse(rx, ry, 6 + r2() * 20, 3 + r2() * 9, r2() * PI, 0, TAU);
      g.fill();
    }

    // 四周内阴影
    var sh = g.createLinearGradient(0, ay, 0, ay + 90);
    sh.addColorStop(0, 'rgba(2,3,8,0.95)');
    sh.addColorStop(1, 'rgba(2,3,8,0)');
    g.fillStyle = sh; g.fillRect(ax, ay, aw, 90);
    var sh2 = g.createLinearGradient(ax, 0, ax + 90, 0);
    sh2.addColorStop(0, 'rgba(2,3,8,0.8)'); sh2.addColorStop(1, 'rgba(2,3,8,0)');
    g.fillStyle = sh2; g.fillRect(ax, ay, 90, ah);
    var sh3 = g.createLinearGradient(ARENA.x1, 0, ARENA.x1 - 90, 0);
    sh3.addColorStop(0, 'rgba(2,3,8,0.8)'); sh3.addColorStop(1, 'rgba(2,3,8,0)');
    g.fillStyle = sh3; g.fillRect(ARENA.x1 - 90, ay, 90, ah);
    g.restore();
  }

  function drawBackWall(g, act, r2) {
    var top = 0, bottom = ARENA.y0;
    var wg = g.createLinearGradient(0, top, 0, bottom);
    wg.addColorStop(0, '#07080f');
    wg.addColorStop(0.55, shade(act.tint, -0.62));
    wg.addColorStop(1, shade(act.tint, -0.42));
    g.fillStyle = wg;
    g.fillRect(0, top, W, bottom);

    // 巨石砌墙
    var bs = 58, row = 0;
    for (var y = top; y < bottom; y += bs) {
      var off = (row % 2) * bs * 0.5;
      for (var x = -bs; x < W + bs; x += bs) {
        var v = r2();
        g.fillStyle = 'rgba(' + Math.round(22 + v * 16) + ',' + Math.round(26 + v * 18) + ',' + Math.round(38 + v * 22) + ',1)';
        g.fillRect(x + off + 2, y + 2, bs - 4, bs - 4);
        g.strokeStyle = 'rgba(0,0,0,0.55)';
        g.lineWidth = 2;
        g.strokeRect(x + off + 1, y + 1, bs - 2, bs - 2);
      }
      row++;
    }

    // 拱门
    var gx = W / 2, gw = 190, gh = bottom - 18;
    g.fillStyle = '#04050a';
    g.beginPath();
    g.moveTo(gx - gw / 2, bottom);
    g.lineTo(gx - gw / 2, bottom - gh * 0.55);
    g.quadraticCurveTo(gx - gw / 2, bottom - gh, gx, bottom - gh);
    g.quadraticCurveTo(gx + gw / 2, bottom - gh, gx + gw / 2, bottom - gh * 0.55);
    g.lineTo(gx + gw / 2, bottom);
    g.closePath(); g.fill();
    g.strokeStyle = rgba(act.tint, 0.7);
    g.lineWidth = 8;
    g.stroke();
    g.strokeStyle = 'rgba(230,220,190,0.16)';
    g.lineWidth = 2;
    g.stroke();

    // 门栅
    g.strokeStyle = 'rgba(120,130,150,0.55)';
    g.lineWidth = 5;
    for (var i = 0; i < 7; i++) {
      var bx = gx - gw / 2 + 18 + i * ((gw - 36) / 6);
      g.beginPath();
      g.moveTo(bx, bottom);
      g.lineTo(bx, bottom - gh * 0.78);
      g.stroke();
    }

    // 侧边立柱
    var pillars = [gx - gw / 2 - 140, gx + gw / 2 + 140];
    for (i = 0; i < pillars.length; i++) {
      drawPillar(g, pillars[i], bottom, 62, bottom - 6, act);
    }

    // 拱门两侧的守殿石像
    drawStatue(g, gx - 195, bottom, act);
    drawStatue(g, gx + 195, bottom, act);

    // 旗帜
    for (i = 0; i < 2; i++) {
      var fx = gx + (i === 0 ? -1 : 1) * 330;
      g.fillStyle = shade(act.tint, -0.2);
      g.beginPath();
      g.moveTo(fx - 34, 26);
      g.lineTo(fx + 34, 26);
      g.lineTo(fx + 34, 150);
      g.lineTo(fx, 172);
      g.lineTo(fx - 34, 150);
      g.closePath(); g.fill();
      g.strokeStyle = 'rgba(200,182,140,0.35)';
      g.lineWidth = 2; g.stroke();
      g.globalAlpha = 0.75;
      star4(g, '#d8c89a', fx, 96, 15, 0);
      g.globalAlpha = 1;
    }

    // 火盆
    var bx2 = [gx - 430, gx + 430, ARENA.x0 + 40, ARENA.x1 - 40];
    for (i = 0; i < bx2.length; i++) {
      braziers.push({ x: bx2[i], y: bottom - 4, phase: r2() * TAU, scale: i < 2 ? 1 : 0.8 });
    }
    for (i = 0; i < braziers.length; i++) drawBrazierBase(g, braziers[i]);

    // 墙脚阴影
    var fsh = g.createLinearGradient(0, bottom - 60, 0, bottom + 20);
    fsh.addColorStop(0, 'rgba(0,0,0,0)');
    fsh.addColorStop(1, 'rgba(0,0,0,0.75)');
    g.fillStyle = fsh;
    g.fillRect(0, bottom - 60, W, 80);
  }

  /* 第三幕的矩形墙：顶面 + 正面，带砖缝与边缘高光 */
  function drawWallBlock(g, w, act) {
    var x = w[0], y = w[1], ww = w[2], hh = w[3];
    // 地面阴影
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(x - 8, y + hh - 6, ww + 18, 12);
    // 顶面
    g.fillStyle = shade(act.tint, -0.06);
    g.fillRect(x, y - 20, ww, 22);
    g.fillStyle = 'rgba(225,235,255,0.20)';
    g.fillRect(x, y - 20, ww, 4);
    // 正面
    var fg = g.createLinearGradient(0, y, 0, y + hh);
    fg.addColorStop(0, shade(act.tint, -0.55));
    fg.addColorStop(1, '#080b12');
    g.fillStyle = fg;
    g.fillRect(x, y, ww, hh);
    // 砖缝
    g.strokeStyle = 'rgba(4,6,12,0.6)';
    g.lineWidth = 2;
    for (var yy = y + 22; yy < y + hh; yy += 22) {
      g.beginPath(); g.moveTo(x, yy); g.lineTo(x + ww, yy); g.stroke();
    }
    for (var xx = x + 34; xx < x + ww; xx += 34) {
      g.beginPath(); g.moveTo(xx, y); g.lineTo(xx, y + hh); g.stroke();
    }
    // 边缘光与裂纹
    g.strokeStyle = rgba(act.tint, 0.55);
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y - 20); g.lineTo(x, y + hh); g.stroke();
    g.strokeStyle = 'rgba(6,8,14,0.8)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(x + ww * 0.3, y + 4);
    g.lineTo(x + ww * 0.42, y + hh * 0.5);
    g.lineTo(x + ww * 0.34, y + hh - 4);
    g.stroke();
  }

  function drawStatue(g, x, yBase, act) {
    var s = 1;
    g.save();
    g.translate(x, yBase);
    // 底座
    g.fillStyle = '#121722';
    g.fillRect(-34 * s, -24 * s, 68 * s, 24 * s);
    g.fillStyle = 'rgba(200,190,160,0.10)';
    g.fillRect(-34 * s, -24 * s, 68 * s, 5 * s);
    // 石像：披袍守卫
    g.fillStyle = '#1a2130';
    g.beginPath();
    g.moveTo(-13 * s, -112 * s);
    g.lineTo(13 * s, -112 * s);
    g.quadraticCurveTo(20 * s, -80 * s, 24 * s, -24 * s);
    g.lineTo(-24 * s, -24 * s);
    g.quadraticCurveTo(-20 * s, -80 * s, -13 * s, -112 * s);
    g.closePath();
    g.fill();
    // 头与兜帽
    g.fillStyle = '#1e2637';
    g.beginPath();
    g.arc(0, -124 * s, 12 * s, 0, TAU);
    g.fill();
    g.fillStyle = '#141a26';
    g.beginPath();
    g.ellipse(0, -126 * s, 9 * s, 10 * s, 0, 0, TAU);
    g.fill();
    // 石剑
    g.fillStyle = '#232c3e';
    g.fillRect(14 * s, -108 * s, 5 * s, 70 * s);
    g.fillRect(6 * s, -78 * s, 22 * s, 4 * s);
    // 边缘光
    g.strokeStyle = rgba(act.tint, 0.5);
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-13 * s, -112 * s);
    g.quadraticCurveTo(-20 * s, -80 * s, -24 * s, -24 * s);
    g.stroke();
    g.beginPath();
    g.arc(-5 * s, -128 * s, 9 * s, PI * 0.9, PI * 1.7);
    g.stroke();
    // 石像眼中的微光
    g.fillStyle = rgba('#9fc4ff', 0.25);
    g.beginPath(); g.arc(-4 * s, -124 * s, 1.6 * s, 0, TAU); g.fill();
    g.beginPath(); g.arc(4 * s, -124 * s, 1.6 * s, 0, TAU); g.fill();
    g.restore();
  }

  function drawPillar(g, x, yBase, w, hTop, act) {
    var g2 = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g2.addColorStop(0, '#10131d');
    g2.addColorStop(0.4, shade(act.tint, -0.3));
    g2.addColorStop(0.75, shade(act.tint, -0.55));
    g2.addColorStop(1, '#0a0c14');
    g.fillStyle = g2;
    g.fillRect(x - w / 2, hTop, w, yBase - hTop);
    g.fillStyle = 'rgba(200,190,160,0.07)';
    g.fillRect(x - w / 2 + 6, hTop, 8, yBase - hTop);
    // 柱头
    g.fillStyle = shade(act.tint, -0.25);
    g.fillRect(x - w / 2 - 10, hTop, w + 20, 16);
    g.fillRect(x - w / 2 - 6, yBase - 18, w + 12, 18);
    // 纹路
    g.strokeStyle = 'rgba(0,0,0,0.4)';
    g.lineWidth = 2;
    for (var yy = hTop + 34; yy < yBase - 30; yy += 34) {
      g.beginPath(); g.moveTo(x - w / 2, yy); g.lineTo(x + w / 2, yy); g.stroke();
    }
  }

  function drawBrazierBase(g, b) {
    g.save();
    g.translate(b.x, b.y);
    g.scale(b.scale, b.scale);
    g.fillStyle = '#2a2a33';
    g.beginPath();
    g.moveTo(-18, 0); g.lineTo(18, 0); g.lineTo(12, -22); g.lineTo(-12, -22);
    g.closePath(); g.fill();
    g.fillStyle = '#3b3b46';
    g.fillRect(-20, -26, 40, 6);
    g.restore();
  }

  function drawSideWalls(g, act, r2) {
    var grad = g.createLinearGradient(ARENA.x0 - 46, 0, ARENA.x0, 0);
    grad.addColorStop(0, '#070810');
    grad.addColorStop(1, shade(act.tint, -0.25));
    g.fillStyle = grad;
    g.fillRect(ARENA.x0 - 46, ARENA.y0, 46, ARENA.y1 - ARENA.y0 + 30);
    var grad2 = g.createLinearGradient(ARENA.x1, 0, ARENA.x1 + 46, 0);
    grad2.addColorStop(0, shade(act.tint, -0.25));
    grad2.addColorStop(1, '#070810');
    g.fillStyle = grad2;
    g.fillRect(ARENA.x1, ARENA.y0, 46, ARENA.y1 - ARENA.y0 + 30);
    for (var i = 0; i < 9; i++) {
      g.strokeStyle = 'rgba(0,0,0,0.5)';
      g.lineWidth = 2;
      var yy = ARENA.y0 + 40 + i * ((ARENA.y1 - ARENA.y0) / 8);
      g.beginPath(); g.moveTo(ARENA.x0 - 46, yy); g.lineTo(ARENA.x0, yy); g.stroke();
      g.beginPath(); g.moveTo(ARENA.x1, yy); g.lineTo(ARENA.x1 + 46, yy); g.stroke();
    }
    // 墙边高光
    g.fillStyle = 'rgba(190,205,255,0.06)';
    g.fillRect(ARENA.x0 - 6, ARENA.y0, 6, ARENA.y1 - ARENA.y0);
    g.fillRect(ARENA.x1, ARENA.y0, 6, ARENA.y1 - ARENA.y0);
  }

  function drawFrontEdge(g, act) {
    var y = ARENA.y1;
    g.fillStyle = '#080a11';
    g.fillRect(0, y, W, H - y);
    var grad = g.createLinearGradient(0, y, 0, y + 46);
    grad.addColorStop(0, shade(act.tint, -0.35));
    grad.addColorStop(1, '#05060b');
    g.fillStyle = grad;
    g.fillRect(0, y, W, 46);
    g.strokeStyle = 'rgba(200,190,160,0.10)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y + 1); g.lineTo(W, y + 1); g.stroke();
    // 台阶
    for (var i = 1; i <= 3; i++) {
      g.strokeStyle = 'rgba(0,0,0,0.55)';
      g.beginPath(); g.moveTo(0, y + i * 14); g.lineTo(W, y + i * 14); g.stroke();
    }
  }

  function drawStatic() {
    if (!staticLayer) buildStatic();
    if (staticLayer) ctx.drawImage(staticLayer, 0, 0);
  }

  /* ============================================================
   * 23. 动态场景绘制
   * ============================================================ */
  var tNow = 0;

  function drawBraziers() {
    for (var i = 0; i < braziers.length; i++) {
      var b = braziers[i];
      var f = Math.sin(tNow * 9 + b.phase) * 0.5 + 0.5;
      var s = b.scale;
      ctx.save();
      ctx.translate(b.x, b.y - 28 * s);
      ctx.globalCompositeOperation = 'lighter';
      var gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 90 * s);
      gl.addColorStop(0, 'rgba(255,190,90,' + (0.35 + f * 0.12) + ')');
      gl.addColorStop(0.4, 'rgba(255,120,40,0.15)');
      gl.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, 90 * s, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(255,170,70,0.85)';
      ctx.beginPath();
      ctx.moveTo(-7 * s, 6 * s);
      ctx.quadraticCurveTo(-10 * s, -14 * s - f * 8 * s, 0, -22 * s - f * 10 * s);
      ctx.quadraticCurveTo(10 * s, -14 * s - f * 8 * s, 7 * s, 6 * s);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,190,0.95)';
      ctx.beginPath(); ctx.ellipse(0, 0, 4 * s, 7 * s, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawLava() {
    if (!room || !room.lava || !room.lava.length) return;
    for (var i = 0; i < room.lava.length; i++) {
      var r = room.lava[i];
      // 外溢光
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var og = ctx.createRadialGradient(r[0] + r[2] / 2, r[1] + r[3] / 2, 10, r[0] + r[2] / 2, r[1] + r[3] / 2, Math.max(r[2], r[3]) * 0.9);
      og.addColorStop(0, 'rgba(255,120,40,0.20)');
      og.addColorStop(0.6, 'rgba(255,80,20,0.08)');
      og.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = og;
      ctx.fillRect(r[0] - r[2] * 0.4, r[1] - r[3] * 0.4, r[2] * 1.8, r[3] * 1.8);
      ctx.restore();

      // 石池边
      ctx.save();
      ctx.fillStyle = '#1b1a1f';
      roundRect(ctx, r[0] - 8, r[1] - 8, r[2] + 16, r[3] + 16, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,150,70,0.25)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      roundRect(ctx, r[0], r[1], r[2], r[3], 8);
      ctx.clip();
      var g = ctx.createRadialGradient(r[0] + r[2] * 0.5, r[1] + r[3] * 0.55, 4, r[0] + r[2] * 0.5, r[1] + r[3] * 0.5, Math.max(r[2], r[3]) * 0.75);
      g.addColorStop(0, '#ffd06a');
      g.addColorStop(0.28, '#ff7a1e');
      g.addColorStop(0.62, '#a82406');
      g.addColorStop(1, '#3a0a04');
      ctx.fillStyle = g;
      ctx.fillRect(r[0], r[1], r[2], r[3]);

      // 流动的暗色壳
      ctx.globalCompositeOperation = 'multiply';
      for (var k = 0; k < 4; k++) {
        var cx0 = r[0] + ((Math.sin(tNow * 0.25 + k * 2.3 + i) * 0.5 + 0.5) * r[2]);
        var cy0 = r[1] + ((Math.cos(tNow * 0.21 + k * 1.9 + i) * 0.5 + 0.5) * r[3]);
        ctx.fillStyle = 'rgba(60,10,4,0.45)';
        ctx.beginPath();
        ctx.ellipse(cx0, cy0, r[2] * 0.22, r[3] * 0.16, tNow * 0.1 + k, 0, TAU);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      // 气泡
      ctx.globalCompositeOperation = 'lighter';
      for (var b = 0; b < 6; b++) {
        var bx = r[0] + ((Math.sin(tNow * 0.8 + b * 2.1 + i) * 0.5 + 0.5) * r[2]);
        var by = r[1] + ((Math.cos(tNow * 1.1 + b * 1.7 + i) * 0.5 + 0.5) * r[3]);
        var rr = 4 + Math.sin(tNow * 2.4 + b) * 3;
        var bg = ctx.createRadialGradient(bx, by, 1, bx, by, rr * 3);
        bg.addColorStop(0, 'rgba(255,240,180,0.75)');
        bg.addColorStop(0.5, 'rgba(255,150,50,0.28)');
        bg.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(bx, by, rr * 3, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawGate() {
    if (!room) return;
    var gx = W / 2, gy = ARENA.y0 + 8;
    var open = room.gateOpen;
    var pulse = Math.sin(tNow * 3) * 0.5 + 0.5;
    ctx.save();
    if (open) {
      ctx.globalCompositeOperation = 'lighter';
      var gl = ctx.createRadialGradient(gx, gy, 4, gx, gy, 150);
      gl.addColorStop(0, 'rgba(255,230,166,' + (0.30 + pulse * 0.12) + ')');
      gl.addColorStop(0.45, 'rgba(255,200,90,0.10)');
      gl.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(gx, gy, 150, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(255,236,190,0.85)';
      ctx.font = 'bold 22px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('F', gx, gy + 62);
      ctx.textAlign = 'left';
      if (Math.abs(hero.y - (ARENA.y0 + 30)) < 120 && Math.abs(hero.x - gx) < 140) {
        ctx.fillStyle = '#ffe6a6';
        ctx.font = 'bold 18px "Microsoft YaHei", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('按 F 前往下一间', gx, gy + 96);
        ctx.textAlign = 'left';
      }
    } else {
      ctx.strokeStyle = room.cleared ? 'rgba(180,150,90,0.7)' : 'rgba(150,160,180,0.5)';
      ctx.lineWidth = 4;
      ctx.strokeRect(gx - 70, gy, 140, 4);
      if (room.cleared && !switchesDone()) {
        var on = 0;
        for (var s = 0; s < room.switches.length; s++) if (room.switches[s].on) on++;
        ctx.fillStyle = '#9fe8ff';
        ctx.font = 'bold 16px "Microsoft YaHei", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('机关 ' + on + '/' + room.switches.length + ' · 启动后开门', gx, gy + 40);
        ctx.textAlign = 'left';
      }
    }
    ctx.restore();
  }

  function drawSwitches() {
    if (!room || !room.switches.length) return;
    for (var i = 0; i < room.switches.length; i++) {
      var sw = room.switches[i];
      var pulse = Math.sin(tNow * 2.4 + i) * 0.5 + 0.5;
      ctx.save();
      if (sw.on) {
        ctx.globalCompositeOperation = 'lighter';
        var gl = ctx.createRadialGradient(sw.x, sw.y, 2, sw.x, sw.y, 90);
        gl.addColorStop(0, 'rgba(160,235,255,' + (0.30 + pulse * 0.12) + ')');
        gl.addColorStop(0.5, 'rgba(120,200,255,0.12)');
        gl.addColorStop(1, 'rgba(90,160,255,0)');
        ctx.fillStyle = gl;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, 90, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      // 石座
      ctx.fillStyle = sw.on ? 'rgba(40,80,110,0.9)' : 'rgba(26,32,48,0.95)';
      ctx.beginPath(); ctx.ellipse(sw.x, sw.y, 34, 18, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = sw.on ? '#9fe8ff' : 'rgba(140,160,190,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      star4(ctx, sw.on ? '#bff0ff' : '#4d5c78', sw.x, sw.y - 6, sw.on ? 12 + pulse * 2 : 10, tNow * (sw.on ? 1.4 : 0.2));
      if (sw.on) {
        ctx.strokeStyle = 'rgba(160,235,255,' + (0.25 + pulse * 0.25) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, 40 + pulse * 6, 0, TAU); ctx.stroke();
      }
      ctx.restore();
      if (!sw.on && dist(hero.x, hero.y, sw.x, sw.y) < 120) {
        ctx.save();
        ctx.fillStyle = '#9fe8ff';
        ctx.font = 'bold 16px "Microsoft YaHei", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('F 启动机关', sw.x, sw.y - 44);
        ctx.restore();
      }
    }
  }

  function drawTelegraphs() {
    if (!room) return;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead) continue;
      if (e.kind === 'archer' && e.act === 'aim') {
        var a = Math.atan2(hero.y - e.y, hero.x - e.x);
        ctx.save();
        ctx.strokeStyle = 'rgba(200,160,255,0.55)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y - 20); ctx.lineTo(e.x + Math.cos(a) * 620, e.y - 20 + Math.sin(a) * 620); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(200,160,255,0.30)';
        ctx.beginPath(); ctx.arc(e.x, e.y - 20, 18, 0, TAU); ctx.fill();
        ctx.restore();
      } else if (e.kind === 'charger' && e.act === 'windup') {
        var a2 = Math.atan2(hero.y - e.y, hero.x - e.x);
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(a2);
        ctx.fillStyle = 'rgba(255,90,60,' + (0.18 + Math.sin(tNow * 22) * 0.06) + ')';
        ctx.beginPath();
        ctx.moveTo(20, -26); ctx.lineTo(400, -30); ctx.lineTo(430, 0); ctx.lineTo(400, 30); ctx.lineTo(20, 26);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,120,80,0.7)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      } else if ((e.kind === 'guard' || e.kind === 'elite' || e.kind === 'warden') && e.act === 'windup') {
        var a3 = Math.atan2(hero.y - e.y, hero.x - e.x);
        var rr = e.kind === 'guard' ? 112 : 130;
        var half = e.kind === 'guard' ? 1.0 : 1.1;
        ctx.save();
        ctx.fillStyle = 'rgba(255,80,60,0.16)';
        sector(ctx, e.x, e.y, rr, a3 - half, a3 + half);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,110,80,0.65)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      } else if ((e.kind === 'elite' || e.kind === 'warden') && e.act === 'nova') {
        var t = 1 - clamp(e.t / 0.9, 0, 1);
        ctx.save();
        ctx.fillStyle = 'rgba(255,90,40,' + (0.06 + t * 0.14) + ')';
        ctx.beginPath(); ctx.arc(e.x, e.y, 250 * t + 20, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,140,80,0.8)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(e.x, e.y, 250, 0, TAU); ctx.stroke();
        ctx.restore();
      } else if (e.kind === 'boss') {
        if (e.act === 'slash3') {
          var a4 = e.face !== undefined ? e.face : Math.atan2(hero.y - e.y, hero.x - e.x);
          ctx.save();
          ctx.fillStyle = 'rgba(255,70,70,0.13)';
          sector(ctx, e.x, e.y, 168, a4 - 1.35, a4 + 1.35);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,100,90,0.6)';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        } else if (e.act === 'dashWind') {
          var a5 = Math.atan2(hero.y - e.y, hero.x - e.x);
          ctx.save();
          ctx.translate(e.x, e.y);
          ctx.rotate(a5);
          ctx.fillStyle = 'rgba(255,80,60,0.18)';
          ctx.fillRect(0, -40, 900, 80);
          ctx.strokeStyle = 'rgba(255,120,90,0.6)';
          ctx.lineWidth = 3;
          ctx.strokeRect(0, -40, 900, 80);
          ctx.restore();
        } else if (e.act === 'barrage') {
          ctx.save();
          ctx.strokeStyle = 'rgba(200,140,255,0.5)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(e.x, e.y, 70 + Math.sin(tNow * 10) * 6, 0, TAU); ctx.stroke();
          ctx.restore();
        } else if (e.act === 'nova') {
          var tt = 1 - clamp(e.t / 1.0, 0, 1);
          ctx.save();
          ctx.fillStyle = 'rgba(255,70,70,' + (0.05 + tt * 0.12) + ')';
          ctx.beginPath(); ctx.arc(e.x, e.y, 340 * tt + 30, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(255,110,90,0.75)';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(e.x, e.y, 340, 0, TAU); ctx.stroke();
          ctx.restore();
        }
      }
    }
  }

  function drawShadow(x, y, size, alpha) {
    ctx.fillStyle = 'rgba(0,0,0,' + (alpha === undefined ? 0.42 : alpha) + ')';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, size * 0.38, size * 0.13, 0, 0, TAU);
    ctx.fill();
  }

  function drawSpriteAt(key, x, y, size, flip, flash, alpha, squash) {
    var bmp = charBitmap(key, false);
    var d = size / 0.922;
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.translate(x, 0);
    if (squash && squash !== 1) {
      // 以脚底为轴的竖直缩放：待机呼吸、蓄力、受击都用它
      ctx.translate(0, y);
      ctx.scale(1, squash);
      ctx.translate(0, -y);
    }
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(bmp, -d / 2, y - 0.8688 * d, d, d);
    if (flash) {
      var w = charBitmap(key, true);
      ctx.globalAlpha = 0.42 * (alpha === undefined ? 1 : alpha);
      ctx.drawImage(w, -d / 2, y - 0.8688 * d, d, d);
    }
    ctx.restore();
  }

  function drawHeroEntity() {
    var heroSize = 92;
    if (hero.ww > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var r = stats.wwRadius;
      var a = clamp(hero.ww / 0.45, 0, 1);
      var g = ctx.createRadialGradient(hero.x, hero.y - 20, 10, hero.x, hero.y - 20, r + 30);
      g.addColorStop(0, 'rgba(255,220,140,' + 0.12 * a + ')');
      g.addColorStop(0.7, 'rgba(255,200,90,' + 0.16 * a + ')');
      g.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(hero.x, hero.y - 20, r + 30, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,230,170,' + 0.55 * a + ')';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(hero.x, hero.y - 26, r * (0.6 + 0.4 * (1 - a)), tNow * 14, tNow * 14 + 2.4);
      ctx.stroke();
      ctx.restore();
    }
    // 闪避残影（新：随时间自然淡出，取代旧的固定两张分身）
    for (var gi = 0; gi < ghosts.length; gi++) {
      var gh = ghosts[gi];
      var ga = 1 - gh.age / gh.life;
      drawSpriteAt('hero', gh.x, gh.y, heroSize, gh.flip, false, 0.34 * ga * ga);
    }
    // 武器形态光环
    if (stats.weaponForm) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var wg = ctx.createRadialGradient(hero.x + 24, hero.y - 46, 2, hero.x + 24, hero.y - 46, 44);
      wg.addColorStop(0, 'rgba(180,230,255,0.30)');
      wg.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.fillStyle = wg;
      ctx.beginPath(); ctx.arc(hero.x + 24, hero.y - 46, 44, 0, TAU); ctx.fill();
      ctx.restore();
    }
    drawShadow(hero.x, hero.y, heroSize, 0.45);
    var blink = hero.invuln > 0 && hero.invuln < 0.7 && Math.floor(hero.invuln * 16) % 2 === 0;
    // 待机呼吸：站定不动时轻微起伏，出手/闪避时收回，避免"纸片人"感
    var heroMoving = Math.hypot(hero.vx, hero.vy) > 20;
    var heroIdle = !heroMoving && hero.atkTimer <= 0 && hero.dodge <= 0 && hero.ww <= 0;
    var breathScale = heroIdle ? 1 + Math.sin(tNow * 2.6) * 0.020 : 1;
    var breathBob = heroIdle ? Math.sin(tNow * 2.6 + 0.5) * 1.4 : 0;
    drawSpriteAt('hero', hero.x, hero.y + breathBob, heroSize, Math.cos(hero.face) < 0, hero.flash > 0, blink ? 0.45 : 1, breathScale);
    if (hero.guard) {
      // 格挡光环：起手 0.15s 内是金色（弹反窗口），之后转为淡蓝
      var parryWin = hero.guardT <= 0.15;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = parryWin ? 0.9 : 0.7;
      ctx.strokeStyle = parryWin ? 'rgba(255,232,170,0.95)' : 'rgba(150,205,255,0.8)';
      ctx.lineWidth = parryWin ? 7 : 4.5;
      ctx.beginPath();
      ctx.arc(hero.x, hero.y - 26, 46, hero.face - 0.95, hero.face + 0.95);
      ctx.stroke();
      ctx.globalAlpha = parryWin ? 0.18 : 0.09;
      ctx.fillStyle = parryWin ? '#ffe6a6' : '#9fd8ff';
      sector(ctx, hero.x, hero.y - 26, 46, hero.face - 0.95, hero.face + 0.95);
      ctx.fill();
      ctx.restore();
    }
    if (hero.shield > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(140,220,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(hero.x, hero.y - 26, 38, 46, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(140,220,255,0.08)';
      ctx.fill();
      ctx.restore();
    }
    if (hero.critNext > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,220,130,' + (0.25 + Math.sin(tNow * 16) * 0.1) + ')';
      ctx.beginPath(); ctx.arc(hero.x, hero.y - 26, 40, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemyEntity(e) {
    if (e.dead) return;
    var size = e.size;
    if (e.state === 'spawn') {
      var t = 1 - clamp(e.spawnT / 0.5, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, 60);
      g.addColorStop(0, 'rgba(180,130,255,' + 0.6 * t + ')');
      g.addColorStop(1, 'rgba(120,60,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, 50 * t, 22 * t, 0, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    if (e.kind === 'boss' || e.kind === 'elite' || e.kind === 'warden') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var col = e.kind === 'boss' ? '#ff5a4a' : (e.kind === 'warden' ? '#8fd0ff' : '#ff8a4a');
      var gg = ctx.createRadialGradient(e.x, e.y - size * 0.3, 4, e.x, e.y - size * 0.3, size * 0.9);
      gg.addColorStop(0, rgba(col === '#8fd0ff' ? '#8fd0ff' : '#ff6a3a', e.enraged ? 0.35 : 0.20));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(e.x, e.y - size * 0.3, size * 0.9, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // 精英 / 督军 血条
    if (e.kind === 'elite' || e.kind === 'warden') {
      var bw = 96, bh = 6;
      var bx = e.x - bw / 2, by = e.y - size * 0.95;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = e.enraged ? '#ff6a4a' : '#c8a4ff';
      ctx.fillRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), bh);
    }
    drawShadow(e.x, e.y, size, 0.4);
    var flip = Math.cos(e.dir) < 0;
    if (e.kind === 'slime') {
      var squish = 1 + Math.sin(e.wob + tNow * 6) * 0.04;
      drawSpriteAt(e.sprite, e.x, e.y, size * squish, false, e.flash > 0);
    } else if (e.kind === 'archer') {
      drawSpriteAt(e.sprite, e.x, e.y, size, flip, e.flash > 0);
    } else if (e.kind === 'charger' && e.act === 'charge') {
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawSpriteAt(e.sprite, e.x - Math.cos(e.chargeDir) * 30, e.y - Math.sin(e.chargeDir) * 18, size, flip, false);
      ctx.restore();
      drawSpriteAt(e.sprite, e.x, e.y, size, flip, e.flash > 0);
    } else if (e.kind === 'boss') {
      drawSpriteAt(e.sprite, e.x, e.y, size, flip, e.flash > 0);
      if (e.enraged) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255,80,60,' + (0.4 + Math.sin(tNow * 8) * 0.2) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(e.x, e.y - 20, size * 0.55, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    } else if (e.kind === 'warden') {
      drawSpriteAt(e.sprite, e.x, e.y, size, flip, e.flash > 0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(120,220,255,0.35)';
      ctx.lineWidth = 2;
      for (var i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(e.x, e.y - 30, 30 + i * 14 + Math.sin(tNow * 4 + i) * 4, tNow * 2 + i, tNow * 2 + i + 1.6);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      drawSpriteAt(e.sprite, e.x, e.y, size, flip, e.flash > 0);
    }
    if (e.stun > 0) {
      ctx.save();
      ctx.fillStyle = '#ffe6a6';
      for (var s = 0; s < 3; s++) {
        var a = tNow * 5 + s * 2.1;
        ctx.beginPath();
        ctx.arc(e.x + Math.cos(a) * 18, e.y - e.size * 0.95 + Math.sin(a) * 5, 3, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawDrops() {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var z = d.z || 0;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(d.x, d.y - z - 6, 1, d.x, d.y - z - 6, 18);
      g.addColorStop(0, 'rgba(255,240,190,0.9)');
      g.addColorStop(0.4, 'rgba(255,200,90,0.35)');
      g.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y - z - 6, 18, 0, TAU); ctx.fill();
      ctx.restore();
      star4(ctx, '#ffe8a8', d.x, d.y - z - 6, 6, tNow * 2 + i);
    }
  }

  function drawProjectiles() {
    for (var i = 0; i < projectiles.length; i++) {
      var p = projectiles[i];
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * 3);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.4, rgba(p.color, 0.55));
      g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.7, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawEffects() {
    for (var i = 0; i < effects.length; i++) {
      var e = effects[i];
      var t = e.age / e.life;
      var a = 1 - t;
      ctx.save();
      if (e.type === 'spark') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, 3.5 * a + 1, 0, TAU); ctx.fill();
      } else if (e.type === 'ring') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a * 0.9;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 3 + 9 * a;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke();
      } else if (e.type === 'slash') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a * 0.9;
        var col = e.color || (e.idx === 2 ? '#ffe6a6' : (e.idx === 1 ? '#b9d4ff' : '#dfe9ff'));
        if (e.idx === 1) {
          // 第二段 · 回旋：整圈刀光 + 外层扩散环
          var rr = e.r * (0.55 + 0.45 * t);
          ctx.strokeStyle = rgba(col, 0.9);
          ctx.lineWidth = 5 * a + 1;
          ctx.beginPath(); ctx.arc(e.x, e.y - 18, rr, 0, TAU); ctx.stroke();
          ctx.globalAlpha = a * 0.45;
          ctx.strokeStyle = rgba(col, 0.6);
          ctx.lineWidth = 14 * a + 3;
          ctx.beginPath(); ctx.arc(e.x, e.y - 18, rr * 0.88, 0, TAU); ctx.stroke();
        } else if (e.idx === 2) {
          // 第三段 · 下劈：头顶竖直劈落 + 落地冲击环
          var sdx = Math.cos(e.dir), sdy = Math.sin(e.dir);
          var sx0 = e.x - sdx * e.r * 0.30, sy0 = e.y - 128;
          var sx1 = e.x + sdx * e.r * 0.95, sy1 = e.y + 6;
          var lg = ctx.createLinearGradient(sx0, sy0, sx1, sy1);
          lg.addColorStop(0, rgba(col, 0));
          lg.addColorStop(0.45, rgba(col, 0.9));
          lg.addColorStop(1, rgba(col, 0));
          ctx.strokeStyle = lg;
          ctx.lineWidth = 15 * a + 2;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1); ctx.stroke();
          ctx.globalAlpha = a * 0.5;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4 * a + 1;
          ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1); ctx.stroke();
          ctx.globalAlpha = a * 0.65;
          ctx.strokeStyle = rgba(col, 0.75);
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(sx1, sy1, e.r * 0.5 * (0.35 + t), e.r * 0.18 * (0.35 + t), 0, 0, TAU);
          ctx.stroke();
        } else {
          // 第一段 · 横斩：水平扇形刀光
          var sweep = e.arc * (0.35 + 0.65 * t);
          var gr = ctx.createRadialGradient(e.x, e.y - 20, 10, e.x, e.y - 20, e.r + 10);
          gr.addColorStop(0, rgba(col, 0.05));
          gr.addColorStop(0.75, rgba(col, 0.30));
          gr.addColorStop(1, rgba(col, 0));
          ctx.fillStyle = gr;
          sector(ctx, e.x, e.y - 20, e.r + 10, e.dir - e.arc / 2, e.dir - e.arc / 2 + sweep);
          ctx.fill();
          ctx.strokeStyle = rgba(col, 0.85);
          ctx.lineWidth = 4 * a + 1;
          ctx.beginPath();
          ctx.arc(e.x, e.y - 20, e.r - 8, e.dir - e.arc / 2, e.dir - e.arc / 2 + sweep);
          ctx.stroke();
        }
        ctx.lineCap = 'butt';
      } else if (e.type === 'beam') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.strokeStyle = 'rgba(160,230,255,0.35)';
        ctx.lineWidth = 18 * a + 4;
        ctx.beginPath(); ctx.moveTo(e.x0, e.y0); ctx.lineTo(e.x1, e.y1); ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5 * a + 1;
        ctx.beginPath(); ctx.moveTo(e.x0, e.y0); ctx.lineTo(e.x1, e.y1); ctx.stroke();
      } else if (e.type === 'spawnring') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(e.x, e.y, 40 * t + 10, 16 * t + 4, 0, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawHazards() {
    for (var i = 0; i < hazards.length; i++) {
      var h = hazards[i];
      var t = h.age / h.life;
      ctx.save();
      if (h.type === 'fire') {
        ctx.globalCompositeOperation = 'lighter';
        var a = clamp(1 - t, 0, 1);
        var g = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, h.r + 10);
        g.addColorStop(0, 'rgba(255,220,140,' + 0.5 * a + ')');
        g.addColorStop(0.5, 'rgba(255,120,40,' + 0.35 * a + ')');
        g.addColorStop(1, 'rgba(255,80,20,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r + 10, (h.r + 10) * 0.5, 0, 0, TAU); ctx.fill();
      } else if (h.type === 'trap') {
        ctx.globalAlpha = clamp(1 - t, 0, 1) * 0.6;
        ctx.strokeStyle = '#b9a7ff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.5, 0, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(150,120,255,0.14)';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var a = clamp(1 - f.age / f.life, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = 'bold ' + f.size + 'px "Microsoft YaHei", system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(4,6,12,0.85)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }

  function drawDarkness() {
    if (!room || !room.dark) return;
    ctx.save();
    var g = ctx.createRadialGradient(hero.x, hero.y - 30, 120, hero.x, hero.y - 30, 470);
    g.addColorStop(0, 'rgba(3,4,10,0)');
    g.addColorStop(0.55, 'rgba(3,4,10,0.45)');
    g.addColorStop(1, 'rgba(3,4,10,0.88)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawPortals() {
    if (!room) return;
    var list = [];
    if (room.portal) list.push({ p: room.portal, color: '#c8a4ff' });
    if (room.backPortal) list.push({ p: room.backPortal, color: '#8fd0ff' });
    for (var i = 0; i < list.length; i++) {
      var pt = list[i].p, col = list[i].color;
      var pulse = Math.sin(tNow * 3 + i) * 0.5 + 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var gl = ctx.createRadialGradient(pt.x, pt.y, 4, pt.x, pt.y, 110);
      gl.addColorStop(0, rgba(col, 0.30 + pulse * 0.10));
      gl.addColorStop(0.45, rgba(col, 0.12));
      gl.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 110, 66, 0, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = rgba(col, 0.85);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 46, 26, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = rgba(col, 0.45);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 30, 16, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgba(col, 0.28);
      ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 20, 11, 0, 0, TAU); ctx.fill();
      // 旋转的星屑
      for (var k = 0; k < 3; k++) {
        var a = tNow * 1.6 + k * 2.1;
        ctx.fillStyle = rgba(col, 0.8);
        ctx.beginPath();
        ctx.arc(pt.x + Math.cos(a) * 40, pt.y + Math.sin(a) * 22, 2.4, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      if (dist(hero.x, hero.y, pt.x, pt.y) < 150) {
        txt('F 传送', pt.x, pt.y - 48, 15, col, 'center');
      }
    }
  }

  function drawWorld() {
    drawStatic();
    drawLava();
    drawHazards();
    drawDrops();
    drawTelegraphs();
    drawGate();
    drawSwitches();
    drawPortals();
    drawBraziers();

    var list = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead) list.push({ y: enemies[i].y, e: enemies[i] });
    }
    list.push({ y: hero.y, hero: true });
    list.sort(function (a, b) { return a.y - b.y; });
    for (var j = 0; j < list.length; j++) {
      if (list[j].hero) drawHeroEntity(); else drawEnemyEntity(list[j].e);
    }
    drawProjectiles();
    drawEffects();
    drawFloaters();

    // 浮尘
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < 26; d++) {
      var mx = ((d * 137 + tNow * 11 * (1 + (d % 3) * 0.3)) % (W + 80)) - 40;
      var my = ((d * 271 + Math.sin(tNow * 0.4 + d) * 40 + tNow * 5) % (H * 0.7)) + 70;
      var al = 0.05 + 0.05 * Math.sin(tNow * 1.4 + d);
      ctx.fillStyle = 'rgba(210,225,255,' + al + ')';
      ctx.beginPath(); ctx.arc(mx, my, 1.4 + (d % 3) * 0.7, 0, TAU); ctx.fill();
    }
    ctx.restore();

    drawDarkness();

    // 暗角
    var vg0 = ctx.createRadialGradient(W / 2, H * 0.52, H * 0.26, W / 2, H * 0.52, H * 0.82);
    vg0.addColorStop(0, 'rgba(2,3,8,0)');
    vg0.addColorStop(1, 'rgba(2,3,8,0.58)');
    ctx.fillStyle = vg0;
    ctx.fillRect(0, 0, W, H);

    // 受伤红边
    if (vignettePulse > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(255,40,40,0)');
      vg.addColorStop(1, 'rgba(255,30,30,' + (0.45 * vignettePulse) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ============================================================
   * 24. HUD（屏幕空间，CSS 像素）
   * ============================================================ */
  var uiRects = [];

  function cssSize() { return { w: canvas.width / dpr, h: canvas.height / dpr }; }
  function uiScale() {
    var c = cssSize();
    return clamp(Math.min(c.w / 1000, c.h / 560), 0.6, 1.3);
  }
  function txt(str, x, y, size, color, align, weight, family) {
    ctx.font = (weight || 'bold') + ' ' + Math.round(size) + 'px ' + (family || '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif');
    ctx.textAlign = align || 'left';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function txtOutline(str, x, y, size, color, align, lw) {
    ctx.font = 'bold ' + Math.round(size) + 'px "Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = align || 'left';
    ctx.lineWidth = lw || 5;
    ctx.strokeStyle = 'rgba(3,5,10,0.85)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function fmtTime(sec) {
    var t = Math.max(0, Math.floor(sec));
    var m = Math.floor(t / 60), s = t % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function wrapLines(text, maxW) {
    var lines = [], line = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  function bar(x, y, w, h, pct, colA, colB, label) {
    ctx.fillStyle = 'rgba(4,6,12,0.78)';
    roundRect(ctx, x - 2, y - 2, w + 4, h + 4, (h + 4) / 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    roundRect(ctx, x, y, w, h, h / 2);
    ctx.fill();
    var ww = Math.max(0, w * clamp(pct, 0, 1));
    if (ww > 0.5) {
      var g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, colA); g.addColorStop(1, colB);
      ctx.fillStyle = g;
      roundRect(ctx, x, y, Math.max(h, ww), h, h / 2);
      ctx.fill();
    }
    if (label) {
      ctx.save();
      ctx.font = 'bold ' + Math.round(h * 0.82) + 'px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillText(label, x + 8, y + h / 2 + 0.5);
      ctx.restore();
    }
  }

  function drawSkillGlyph(id, x, y, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.lineCap = 'round';
    if (id === 'attack') {
      ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.45); ctx.lineTo(r * 0.45, -r * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.15, -r * 0.5); ctx.lineTo(r * 0.5, -r * 0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.2); ctx.lineTo(-r * 0.2, r * 0.55); ctx.stroke();
    } else if (id === 'dodge') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.45, -r * 0.4); ctx.lineTo(r * 0.15, 0); ctx.lineTo(-r * 0.45, r * 0.4);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.1, -r * 0.4); ctx.lineTo(r * 0.6, 0); ctx.lineTo(r * 0.1, r * 0.4); ctx.stroke();
    } else if (id === 'ww') {
      for (var i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r * (0.28 + i * 0.24), -0.4 + i * 1.2, 2.4 + i * 1.2);
        ctx.stroke();
      }
    } else if (id === 'rb') {
      ctx.beginPath(); ctx.arc(0, 0, r * 0.24, 0, TAU); ctx.fill();
      for (var k = 0; k < 8; k++) {
        var a = (k / 8) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38);
        ctx.lineTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62);
        ctx.stroke();
      }
    } else if (id === 'potion') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.16, -r * 0.5); ctx.lineTo(r * 0.16, -r * 0.5); ctx.lineTo(r * 0.16, -r * 0.18);
      ctx.quadraticCurveTo(r * 0.5, r * 0.1, r * 0.3, r * 0.48);
      ctx.lineTo(-r * 0.3, r * 0.48);
      ctx.quadraticCurveTo(-r * 0.5, r * 0.1, -r * 0.16, -r * 0.18);
      ctx.closePath();
      ctx.stroke();
    } else if (id === 'ult') {
      star4(ctx, color, 0, 0, r * 0.6, 0);
    } else if (id === 'guard') {
      // 盾牌轮廓
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.58);
      ctx.lineTo(r * 0.46, -r * 0.30);
      ctx.lineTo(r * 0.46, r * 0.10);
      ctx.quadraticCurveTo(r * 0.44, r * 0.52, 0, r * 0.62);
      ctx.quadraticCurveTo(-r * 0.44, r * 0.52, -r * 0.46, r * 0.10);
      ctx.lineTo(-r * 0.46, -r * 0.30);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -r * 0.30); ctx.lineTo(0, r * 0.34); ctx.stroke();
    }
    ctx.restore();
  }

  function skillButton(id, x, y, r, label, key, cd, cdMax, color, unlocked) {
    btnRects.push({ id: id, x: x, y: y, r: r });
    ctx.save();
    var pressed = btnState[id] > 0;
    var rr = pressed ? r * 0.94 : r;
    ctx.globalAlpha = unlocked === false ? 0.35 : 1;
    ctx.fillStyle = 'rgba(8,10,20,0.72)';
    ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, r * 0.07);
    ctx.beginPath(); ctx.arc(x, y, rr - 1, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba('#ffffff', 0.04);
    ctx.beginPath(); ctx.arc(x, y, rr - 5, 0, TAU); ctx.fill();
    drawSkillGlyph(id, x, y, rr, color);
    if (cd > 0.03) {
      var frac = clamp(cd / (cdMax || 1), 0, 1);
      ctx.fillStyle = 'rgba(2,4,10,0.72)';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, rr, -PI / 2, -PI / 2 + TAU * frac);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + Math.round(r * 0.62) + 'px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(cd), x, y + 1);
    }
    if (key) {
      ctx.font = 'bold ' + Math.round(r * 0.34) + 'px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(key, x, y + rr + r * 0.28);
    }
    ctx.restore();
  }

  /* 房间网络小地图：节点轮廓 + 当前所在 + 已探索 */
  function drawMinimap(c, s) {
    var act = graphAct();
    if (!act) return;
    var w = 176 * s, h = 96 * s, x = 20 * s, y = 104 * s;
    ctx.save();
    ctx.fillStyle = 'rgba(6,8,14,0.78)';
    roundRect(ctx, x, y, w, h, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(201,165,90,0.32)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    txt('裂隙地图', x + 10 * s, y - 7 * s, 9 * s, 'rgba(201,165,90,0.75)');
    var pad = 14 * s;
    var ix = x + pad, iy = y + pad, iw = w - pad * 2, ih = h - pad * 2;
    var nodes = act.graph.nodes, id, n;
    // 连线
    for (id in nodes) {
      n = nodes[id];
      var ax = ix + n.mx * iw, ay = iy + n.my * ih;
      var list = (n.next || []).slice();
      for (var q = 0; q < list.length; q++) {
        var nb = nodes[list[q]];
        if (!nb) continue;
        ctx.strokeStyle = 'rgba(140,160,190,0.30)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ix + nb.mx * iw, iy + nb.my * ih); ctx.stroke();
      }
      if (n.portalTo && nodes[n.portalTo]) {
        ctx.strokeStyle = 'rgba(200,164,255,0.55)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ix + nodes[n.portalTo].mx * iw, iy + nodes[n.portalTo].my * ih); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    // 节点
    for (id in nodes) {
      n = nodes[id];
      var nx = ix + n.mx * iw, ny = iy + n.my * ih;
      var cur = room && room.node === id;
      var seen = !!run.visited[id];
      ctx.fillStyle = cur ? '#ffe6a6' : (seen ? 'rgba(120,140,175,0.85)' : 'rgba(90,100,125,0.28)');
      roundRect(ctx, nx - 6 * s, ny - 4 * s, 12 * s, 8 * s, 2 * s);
      ctx.fill();
      if (cur) {
        ctx.strokeStyle = 'rgba(255,230,166,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(nx, ny, 11 * s, 0, TAU); ctx.stroke();

        for (var j = 0; j < ls.length && j < 4; j++) {
          txt(ls[j], x + cw / 2, y0 + 122 * s + j * 18 * s, 11.5 * s, 'rgba(210,218,238,0.85)', 'center', 'normal');
        }
        txt(String(i + 1), x + cw / 2, y0 + ch - 22 * s, 12 * s, 'rgba(255,255,255,0.4)', 'center');
        uiRects.push({ id: 'end' + i, x: x, y: y0, w: cw, h: ch });
      }
      txt('点击 / 按 1 2 3 做出选择', c.w / 2, y0 + ch + 34 * s, 11.5 * s, 'rgba(190,200,225,0.6)', 'center');
    } else {
      var ch2 = ENDINGS[ending.choice];
      drawEndingScene(ending.choice, c);
      // 底部渐隐，保证字幕卡可读，同时把 CG 露出来
      var fade = ctx.createLinearGradient(0, c.h * 0.34, 0, c.h);
      fade.addColorStop(0, 'rgba(3,4,9,0)');
      fade.addColorStop(0.55, 'rgba(3,4,9,0.72)');
      fade.addColorStop(1, 'rgba(3,4,9,0.94)');
      ctx.fillStyle = fade;
      ctx.fillRect(0, c.h * 0.34, c.w, c.h * 0.66);

      var w = Math.min(760 * s, c.w * 0.92), h = 190 * s;
      var x2 = (c.w - w) / 2, y2 = c.h - h - 22 * s;
      panel(x2, y2, w, h, rgba(ch2.color, 0.6));
      txt(ch2.name, x2 + 26 * s, y2 + 34 * s, 24 * s, ch2.color, 'left', 'bold', '"Songti SC", "SimSun", serif');
      ctx.font = '13px "Microsoft YaHei", system-ui, sans-serif';
      var lines = wrapLines(ch2.text, w - 52 * s);
      for (var k = 0; k < lines.length && k < 2; k++) {
        txt(lines[k], x2 + 26 * s, y2 + 60 * s + k * 20 * s, 12.5 * s, 'rgba(230,236,248,0.92)', 'left', 'normal');
      }
      txt(ch2.after, x2 + 26 * s, y2 + 108 * s, 11 * s, '#ffe6a6');
      txt(ch2.epilogue || '', x2 + 26 * s, y2 + 128 * s, 10.5 * s, 'rgba(206,214,236,0.8)', 'left', 'normal');
      txt('等级 Lv.' + run.level + ' · 击杀 ' + run.kills + ' · 用时 ' + fmtTime(runTime) + ' · 死亡 ' + run.deaths, x2 + w - 26 * s, y2 + 108 * s, 10.5 * s, 'rgba(190,200,225,0.7)', 'right');
      var blink = 0.55 + 0.45 * Math.sin(tNow * 3);
      ctx.globalAlpha = blink;
      txt('按 Enter / 轻触 开启 NG+' + (run.ng + 1), x2 + w / 2, y2 + h - 18 * s, 12 * s, '#ffffff', 'center');
      ctx.globalAlpha = 1;
      uiRects.push({ id: 'ngplus', x: x2, y: y2, w: w, h: h });
    }
  }

  function drawPause() {
    var c = cssSize(), s = uiScale();
    dim(0.66);
    txt('暂停', c.w / 2, c.h * 0.3, 34 * s, '#ffffff', 'center', 'bold', '"Songti SC", "SimSun", serif');
    txt('WASD 移动 · 空格 普攻（三段） · Shift 闪避（完美闪避触发慢动作）', c.w / 2, c.h * 0.42, 13 * s, 'rgba(215,224,244,0.85)', 'center');
    txt('E 旋风斩 · R 圣光惩戒 · Q 药水 · T 终结技 · F 门/交互 · M 静音', c.w / 2, c.h * 0.42 + 26 * s, 12 * s, 'rgba(215,224,244,0.7)', 'center');
    txt('P / Esc 继续', c.w / 2, c.h * 0.62, 14 * s, '#ffe6a6', 'center');
  }

  function drawOverlays() {
    if (mode === 'story') drawStory();
    else if (mode === 'path') drawPath();
    else if (mode === 'reward') drawReward();
    else if (mode === 'hub') drawHub();
    else if (mode === 'dead') drawDead();
    else if (mode === 'ending') drawEnding();
    else if (mode === 'pause') drawPause();
  }

  /* ============================================================
   * 26. 渲染入口
   * ============================================================ */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'title') { drawTitle(); return; }

    var shx = shake > 0 ? rnd(-1, 1) * shake * 0.5 : 0;
    var shy = shake > 0 ? rnd(-1, 1) * shake * 0.5 : 0;
    ctx.setTransform(dpr * fitScale, 0, 0, dpr * fitScale, dpr * (ox + pushX + shx), dpr * (oy + pushY + shy));
    drawWorld();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawHUD();
    drawOverlays();
    if (flashWhite > 0) {
      ctx.fillStyle = 'rgba(255,250,235,' + clamp(flashWhite, 0, 0.85) + ')';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  /* ============================================================
   * 27. 输入：指针 / 触屏
   * ============================================================ */
  function pointerCss(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function fireBtn(id) {
    if (mode !== 'room') return;
    if (id === 'attack') doAttack();
    else if (id === 'dodge') doDodge();
    else if (id === 'ww') doWhirlwind();
    else if (id === 'rb') doRetribution();
    else if (id === 'potion') doPotion();
    else if (id === 'ult') doUltimate();
    btnState[id] = 0.12;
  }

  function handleOverlayClick(x, y) {
    var i, r;
    if (panelGuarded()) return;
    for (i = 0; i < uiRects.length; i++) {
      r = uiRects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        if (r.id === 'continue') { continueRun(); return; }
        if (r.id.indexOf('card') === 0) { pickCard(parseInt(r.id.slice(4), 10)); return; }
        if (r.id.indexOf('path') === 0) { choosePath(parseInt(r.id.slice(4), 10)); return; }
        if (r.id.indexOf('hub') === 0) {
          var idx = parseInt(r.id.slice(3), 10);
          hub.index = idx;
          hubDo(hub.rows[idx].id);
          return;
        }
        if (r.id.indexOf('talent') === 0) { pickTalent(['berserk', 'aegis', 'star'][parseInt(r.id.slice(6), 10)]); return; }
        if (r.id.indexOf('bag') === 0) { equipItem(parseInt(r.id.slice(3), 10)); return; }
        if (r.id.indexOf('end') === 0) { chooseEnding(endOptions[parseInt(r.id.slice(3), 10)]); return; }
        if (r.id === 'ngplus') { startNewRun(run.ng + 1); return; }
        if (r.id === 'retry') { retryAct(); return; }
      }
    }
    if (mode === 'title') {
      if (hasSave() && uiRects.length) {
        for (var k = 0; k < uiRects.length; k++) {
          if (uiRects[k].id === 'continue') { continueRun(); return; }
        }
      }
      startNewRun(0);
    } else if (mode === 'story') advanceStory();
    else if (mode === 'dead') retryAct();
    else if (mode === 'ending') {
      if (ending.stage === 'choose') chooseEnding(endOptions[endIndex]);
      else startNewRun(run.ng + 1);
    } else if (mode === 'pause') { mode = 'room'; paused = false; }
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    if (canvas.focus) { try { canvas.focus(); } catch (err) { /* ignore */ } }
    if (e.pointerType === 'touch') touchMode = true;
    var p = pointerCss(e);
    if (e.button === 2) { if (mode === 'room') { hero.guard = true; hero.guardT = 0; } e.preventDefault(); return; }

    if (mode !== 'room') {
      if (mode === 'title' && !uiRects.length) { startNewRun(0); return; }
      if (mode === 'title') {
        var hitContinue = false;
        for (var i = 0; i < uiRects.length; i++) {
          var r = uiRects[i];
          if (r.id === 'continue' && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) hitContinue = true;
        }
        if (hitContinue) { continueRun(); return; }
        startNewRun(0);
        return;
      }
      handleOverlayClick(p.x, p.y);
      return;
    }

    // 技能按钮
    for (var b = 0; b < btnRects.length; b++) {
      var br = btnRects[b];
      if (dist(p.x, p.y, br.x, br.y) < br.r + 8) {
        if (br.id === 'guard') {
          // 格挡是"按住"型按钮，和一次性技能区分开
          if (mode === 'room') { hero.guard = true; hero.guardT = 0; guardPointer = e.pointerId; }
          btnState.guard = 0.12;
        } else {
          fireBtn(br.id);
        }
        e.preventDefault();
        return;
      }
    }
    // 摇杆：左半屏起手
    if (!joystick && p.x < cssSize().w * 0.6) {
      joystick = { id: e.pointerId, ox: p.x, oy: p.y, dx: 0, dy: 0 };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!joystick || e.pointerId !== joystick.id) return;
    var p = pointerCss(e);
    joystick.dx = p.x - joystick.ox;
    joystick.dy = p.y - joystick.oy;
    e.preventDefault();
  });
  function releasePointer(e) {
    if (joystick && e.pointerId === joystick.id) joystick = null;
    if (guardPointer !== null && e.pointerId === guardPointer) { hero.guard = false; guardPointer = null; }
    if (e.button === 2 || e.pointerType === 'mouse' && e.buttons === 0) hero.guard = false;
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('blur', function () {
    keys = Object.create(null);
    joystick = null;
    guardPointer = null;
    hero.guard = false;
    if (mode === 'room') { mode = 'pause'; paused = true; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      keys = Object.create(null);
      joystick = null;
      guardPointer = null;
      hero.guard = false;
      if (mode === 'room') { mode = 'pause'; paused = true; }
    }
  });

  /* ============================================================
   * 28. 主循环
   * ============================================================ */
  var lastTime = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    tNow += dt;
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) { fps = Math.round(fpsFrames / fpsAccum); fpsFrames = 0; fpsAccum = 0; }
    if (btnState.attack > 0) btnState.attack -= dt;
    if (btnState.dodge > 0) btnState.dodge -= dt;
    if (btnState.ww > 0) btnState.ww -= dt;
    if (btnState.rb > 0) btnState.rb -= dt;
    if (btnState.potion > 0) btnState.potion -= dt;
    if (btnState.guard > 0) btnState.guard -= dt;
    if (btnState.ult > 0) btnState.ult -= dt;
    pollGamepad();
    update(dt);
    render();
  }

  /* ============================================================
   * 29. 给 Studio 的接口
   * ============================================================ */
  function r2(v) {
    if (typeof v !== 'number') return v;
    if (!isFinite(v)) return 0;
    var x = Math.round(v * 100) / 100;
    return x === 0 ? 0 : x;
  }
  function emitPhase() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'state', phase: phase, score: Math.round(score) }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  window.__gameState = function () {
    var hearts = hero.hp <= 0 ? 0 : Math.max(1, Math.ceil(hero.hp / stats.maxHp * 5));
    var es = [], ps = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead) es.push({ x: r2(enemies[i].x), y: r2(enemies[i].y), kind: enemies[i].kind });
    }
    for (var j = 0; j < drops.length; j++) ps.push({ x: r2(drops[j].x), y: r2(drops[j].y) });
    return {
      phase: phase,
      mode: mode,
      score: Math.round(score),
      hearts: hearts,
      hp: r2(hero.hp), maxHp: r2(stats.maxHp), mp: r2(hero.mp),
      level: run.level, act: run.act, room: run.room + 1, gold: run.gold, node: run.node || null,
      equip: {
        weapon: run.equipped.weapon ? run.equipped.weapon.name : null,
        armor: run.equipped.armor ? run.equipped.armor.name : null,
        relic: run.equipped.relic ? run.equipped.relic.name : null
      },
      bag: run.bag.length,
      exp: (room && room.expTotal > 0) ? Math.round(100 * Math.min(1, run.expKills / room.expTotal)) : 0,
      expKills: run.expKills,
      bossHp: (function () {
        for (var k = 0; k < enemies.length; k++) if (enemies[k].kind === 'boss' && !enemies[k].dead) return r2(enemies[k].hp);
        return 0;
      })(),
      hero: { x: r2(hero.x), y: r2(hero.y) },
      heroOnScreen: true,
      enemies: es,
      pickups: ps,
      world: { w: W, h: H },
      fps: Math.round(fps)
    };
  };

  window.__autoplay = function () {
    autoOn = true;
    if (mode === 'title') { startNewRun(0); return; }
    if (mode === 'story') { if (storyTimer > 1.0) advanceStory(); return; }
    if (mode === 'path') { choosePath(0); return; }
    if (mode === 'reward') { pickCard(0); return; }
    if (mode === 'hub') { hubAuto(); return; }
    if (mode === 'dead') { retryAct(); return; }
    if (mode === 'pause') { mode = 'room'; return; }
    if (mode === 'ending') {
      if (ending.stage === 'choose') chooseEnding('mercy');
      else startNewRun(run.ng + 1);
      return;
    }
  };

  function hubAuto() {
    if (hub.sub === 'talent') {
      var line = run.talentLine || 'star';
      pickTalent(line);
      return;
    }
    if (hub.sub === 'equip') {
      var best = -1;
      for (var bi = 0; bi < run.bag.length; bi++) {
        var bit = run.bag[bi];
        if (run.level < bit.ilvl) continue;
        var cur = run.equipped[bit.slot];
        if (!cur || itemScore(bit) > itemScore(cur)) { best = bi; break; }
      }
      if (best >= 0) equipItem(best);
      else { hub.sub = null; buildHubRows(); }
      return;
    }
    if (!run.questDone[run.act]) { hubDo('quest'); return; }
    if (run.talentPoints > 0 && run.talentLevel < 5) { hubDo('talent'); return; }
    if (run.talentPoints > 0 && run.talentLevel >= 5 && run.gold >= respecCost() + 60) { hubDo('respec'); return; }
    if (run.gold >= forgeCost(run.forgeW) + 40) { hubDo('weapon'); return; }
    if (run.potions < 2 && run.gold >= R.potionCost) { hubDo('potion'); return; }
    if (run.gold >= forgeCost(run.forgeA) + 40) { hubDo('armor'); return; }
    for (var gi = 0; gi < run.bag.length; gi++) {
      var git = run.bag[gi];
      if (run.level < git.ilvl) continue;
      var curEq = run.equipped[git.slot];
      if (!curEq || itemScore(git) > itemScore(curEq)) { hubDo('equip'); return; }
    }
    hubDo('leave');
  }

  /* 角色特写：仍在使用代码绘制的槽位 */
  var CHARACTERS = ['hero', 'slime', 'archer', 'charger', 'guard', 'elite', 'boss', 'pickup'];
  function renderSlots(size) {
    var out = {};
    for (var i = 0; i < CHARACTERS.length; i++) {
      var key = CHARACTERS[i];
      if (!SLOTS[key] || customArt(key)) continue;
      out[key] = charBitmap(key, false).toDataURL('image/png');
    }
    return out;
  }
  window.__renderSlots = renderSlots;

  var rendersPosted = false;
  function imageSettled() {
    if (rendersPosted) return;
    for (var key in loading) if (loading[key]) return;
    rendersPosted = true;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'renders', renders: renderSlots(256) }, '*');
      }
    } catch (e) { postError('character renders failed: ' + (e && e.message || e)); }
  }

  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });
  function postError(message) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'error', message: String(message).slice(0, 300) }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  /* ============================================================
   * 30. 资源 / 尺寸 / 启动
   * ============================================================ */
  function loadImage(key, url) {
    if (!url) return;
    var img = new Image();
    loading[key] = true;
    img.onload = function () {
      images[key] = img;
      loading[key] = false;
      invalidateCharCache();
      if (key === 'background') staticLayer = null;
      imageSettled();
    };
    img.onerror = function () { loading[key] = false; imageSettled(); };
    img.src = url;
  }

  function resize() {
    var cssW = window.innerWidth || canvas.clientWidth || 1280;
    var cssH = window.innerHeight || canvas.clientHeight || 720;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    fitScale = Math.min(cssW / W, cssH / H);
    ox = (cssW - W * fitScale) / 2;
    oy = (cssH - H * fitScale) / 2;
  }

  function boot() {
    try {
      // 静态 lang 由构建产物决定；这里做运行时断言，保证读屏 / 首帧不会读成英文。
      // 验收：document.documentElement.lang === 'zh-CN'（见 tools/fix-html-lang.js --check）
      if (document.documentElement.lang !== 'zh-CN') document.documentElement.lang = 'zh-CN';
      canvas.setAttribute('role', 'application');
      canvas.setAttribute('aria-label', '星辉幻境：2.5D 锁房动作 RPG。WASD 移动，空格普攻，Shift 闪避，K 或右键格挡（起手瞬间格挡可弹反），E 旋风，R 惩戒，Q 药水，F 交互，T 终结技。');
      canvas.setAttribute('tabindex', '0');
    } catch (err) { /* ignore */ }
    for (var key in SLOTS) {
      if (customArt(key)) loadImage(key, ASSETS[key]);
    }
    resize();
    window.addEventListener('resize', resize);
    // 预生成角色位图，保证首帧就能画
    for (var i = 0; i < CHARACTERS.length; i++) charBitmap(CHARACTERS[i], false), charBitmap(CHARACTERS[i], true);
    requestAnimationFrame(frame);
    imageSettled();
    emitPhase();
  }

  boot();
})();
</script>
</body></html>
