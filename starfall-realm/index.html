  function tone(freq, dur, type, vol, slide, delay) {
    if (!audio || muted) return;
    try {

      var osc = audio.createOscillator();
      var g = audio.createGain();
      osc.type = type || 'square';

      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    } catch (e) { /* ignore */ }
  }

      if (edge(15)) { cardIndex = (cardIndex + 1) % cards.length; sfx.click(); }

      if (edge(13)) { hub.index = (hub.index + 1) % hub.rows.length; sfx.click(); }

    g.lineTo(x - w / 2, y - h / 2 + r);

  function drawCharacter(g, key, size, flash) {
    if (images[key]) {
      var img = images[key];
      var iw = img.naturalWidth || img.width || size;
      var ih = img.naturalHeight || img.height || size;
      var ar = iw / ih, dw, dh;
      if (ar >= 1) { dw = size; dh = size / ar; } else { dh = size; dw = size * ar; }
      g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      return;
    }
    var fn = CHAR[key] || CHAR.slime;
    g.save();
    fn(g, size, !!flash);
    g.restore();
  }

    var id = key + (white ? '#w' : '');

    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.translate(128, 128);
    drawCharacter(g, key, 236, white);
    charCache[id] = c;
    return c;
  }

    elite: { hp: 900, speed: 112, r: 38, dmg: 16, gold: 45, size: 126, sprite: 'elite', name: '精英典狱官' },
    warden: { hp: 1300, speed: 118, r: 40, dmg: 18, gold: 70, size: 136, sprite: 'elite', name: '裂隙督军' },
    boss: { hp: 4200, speed: 108, r: 54, dmg: 18, gold: 300, size: 226, sprite: 'boss', name: '魔王卡奥斯' }
  };

  /* ============================================================
   * 9. 一局的开端 / 故事
   * ============================================================ */
  var story = [], storyIndex = 0, storyTimer = 0, storyAfter = null;
  var cards = [], cardIndex = 0;
  var hub = { rows: [], index: 0, sub: null };
  var ending = { stage: 'choose', choice: null };

  var OPENING = [
    { t: '加冕之夜', s: '圣殿的星辉为凯尔点亮，剑锋映出整座王都的灯火。' },
    { t: '卡奥斯降临', s: '魔王踏碎穹顶。一击贯穿了年轻的圣骑士——星辰核心被夺走。' },
    { t: '断剑', s: '剑断了。艾琳在石化中凝固成最后一尊雕像，凝望着王座的方向。' },
    { t: '三年后', s: '废墟圣殿的尘埃里，断剑重新被握紧。复仇，是唯一的祈祷。' }
  ];

  function startNewRun(ng) {
    var lvl = clamp(Math.round(R.startLevel), 1, 20);
    run = {
      act: R.startAct, room: 0, rooms: 0, level: lvl, gold: 40, potions: R.startPotions,
      kills: 0, deaths: 0, ng: ng || 0, ending: null, questDone: {}, forgeW: 0, forgeA: 0,
      talentLine: null, talentLevel: 0, talentPoints: Math.max(0, lvl - 1),
      runes: {}, affixes: [], relics: [], startAffix: null,
      equipped: { weapon: null, armor: null, relic: null }, bag: [],
      node: null, visited: {}, expKills: 0,
    };
    if (run.ng > 0) run.startAffix = pickEndingAffix(run.ng);
    hero = {
      x: W / 2, y: 430, vx: 0, vy: 0, face: PI / 2, hp: 999, mp: 999,
      atkTimer: 0, atkDur: 0, atkHit: false, combo: 0, comboTimer: 0, atkIndex: 0, atkDir: 0,
      dodge: 0, dodgeDir: 0, invuln: 0, dodgeWindow: 0, dodgeCd: 0, lavaCd: 0, // dodge = 剩余闪避时长
      ww: 0, wwTick: 0, rbcd: 0, wwcd: 0, ultcd: 0, potionCd: 0,
      flash: 0, hurtT: 0, shield: 0, walk: 0, critNext: 0, guard: false, guardT: 0
    };
    recalcStats();
    // NG+ 起始词条并入 affixes，随 recalcStats 生效（不在 recalcStats 里单独读 startAffix）
    if (run.startAffix) { run.affixes.push(run.startAffix); recalcStats(); }
    hero.hp = stats.maxHp; hero.mp = stats.maxMp;
    score = 0; runTime = 0; paused = false;
    enemies.length = 0; projectiles.length = 0; hazards.length = 0;
    effects.length = 0; floaters.length = 0; drops.length = 0;
    phase = 'playing'; mode = 'story';
    story = OPENING.slice(); storyIndex = 0; storyTimer = 0;
    storyAfter = function () { beginAct(run.act); };
    emitPhase();
    // 调试钩子：rules.debugEnding = 1/2/3 可直接查看对应结局 CG
    var dbgEnding = ['', 'revenge', 'mercy', 'inherit'][clamp(Math.round(R.debugEnding || 0), 0, 3)];
    if (dbgEnding && ENDINGS[dbgEnding]) {
      ending.stage = 'result';
      ending.choice = dbgEnding;
      run.ending = dbgEnding;
      mode = 'ending';
      phase = 'won';
    }
  }

  function pickEndingAffix(ng) {
    var meta = loadMeta();
    if (meta.lastEnding && ENDINGS[meta.lastEnding]) return ENDINGS[meta.lastEnding].affix;
    var pool = ['a_edge', 'r_mpreg', 'a_crit'];
    return pool[(ng - 1) % pool.length];
  }

  function advanceStory() {
    if (mode !== 'story') return;
    storyIndex++;
    storyTimer = 0;
    if (storyIndex >= story.length) {
      mode = 'room';
      if (storyAfter) { var f = storyAfter; storyAfter = null; f(); }
    }
  }

  var EVENTS = [
    { id: 'rift', name: '裂隙突袭', desc: '本幕每波敌人 +1' },
    { id: 'escort', name: '护送残魂', desc: '每清空一间房额外 +35 金币' },
    { id: 'altar', name: '献祭祭坛', desc: '立刻获得一次符文启示' }
  ];

  function beginAct(n) {
    run.act = clamp(n, 1, 4);
    run.room = 0;
    if (run.act >= 4 && run.level < 12) { growStats(function () { run.level = 12; }); }
    run.event = pick(EVENTS);
    if (run.event.id === 'altar') {
      var avail = RUNES.filter(function (r) { return !run.runes[r.skill]; });
      if (avail.length) {
        var rr = pick(avail);
        run.runes[rr.skill] = rr.id;
        recalcStats();
        toastMsg('献祭祭坛 · 获得 ' + rr.name);
      } else {
        run.gold += 80;
        toastMsg('献祭祭坛 · 获得 80 金币');
      }
    }
    var actDef = ACTS[run.act - 1];
    if (actDef.graph) {
      run.visited = {};
      startNode(DEBUG_NODE || actDef.graph.start);
    } else {
      startRoom(run.act === R.startAct && R.startRoom > 0 ? R.startRoom - 1 : 0);
    }
    banner = { text: ACTS[run.act - 1].name, sub: ACTS[run.act - 1].sub + '　·　事件：' + run.event.name, t: 0, life: 3.8 };
  }

  /* ============================================================
   * 10. 房间
   * ============================================================ */
  var staticLayer = null, staticSeed = 1;

  function startRoom(index) {
    run.node = null;
    var act = ACTS[run.act - 1];
    var def = act.rooms[clamp(index, 0, act.rooms.length - 1)];
    run.room = clamp(index, 0, act.rooms.length - 1);
    room = {
      act: run.act, index: run.room, def: def, name: def.name,
      type: def.type || 'combat', lava: def.lava || [], walls: def.walls || [],
      dark: !!def.dark || (!!act.dark && !def.noDark),
      cleared: false, wave: -1, waveTimer: 0.9, gateOpen: false,
      switches: (def.switches || []).map(function (s) { return { x: s[0], y: s[1], on: false, glow: 0 }; }),
      fightTime: 0
    };
    room.expTotal = roomExpTarget(room);
    run.expKills = 0;
    enemies.length = 0; projectiles.length = 0; hazards.length = 0;
    effects.length = 0; floaters.length = 0; drops.length = 0;
    hero.x = W / 2; hero.y = ARENA.y1 - 76;
    hero.vx = hero.vy = 0; hero.dodge = 0; hero.ww = 0; hero.atkTimer = 0;
    hero.hp = Math.max(hero.hp, stats.maxHp * 0.55);
    hero.invuln = 0.8;
    staticSeed = 1000 + run.act * 37 + run.room * 11;
    buildStatic();
    mode = 'room';
    if (room.type === 'boss') { sfx.boss(); }
    saveGame();
  }

  function graphAct() {
    var a = ACTS[run.act - 1];
    return a && a.graph ? a : null;
  }

  /* 房间网络：按节点进入 */
  function startNode(id) {
    var act = graphAct();
    if (!act) return;
    var node = act.graph.nodes[id];
    if (!node) return;
    run.node = id;
    run.visited[id] = true;
    run.room = 0;
    room = {
      act: run.act, index: 0, def: node, name: node.name, node: id,
      type: node.type || 'combat', lava: node.lava || [], walls: node.walls || [],
      dark: true,
      cleared: false, wave: -1, waveTimer: 0.9, gateOpen: false,
      switches: (node.switches || []).map(function (s) { return { x: s[0], y: s[1], on: false, glow: 0 }; }),
      portal: node.portalTo ? { x: node.portalX || W / 2, y: node.portalY || 430, to: node.portalTo } : null,
      backPortal: node.backPortalTo ? { x: W / 2, y: 320, to: node.backPortalTo } : null,
      fightTime: 0
    };
    room.expTotal = roomExpTarget(room);
    run.expKills = 0;
    enemies.length = 0; projectiles.length = 0; hazards.length = 0;
    effects.length = 0; floaters.length = 0; drops.length = 0;
    hero.x = W / 2; hero.y = ARENA.y1 - 76;
    hero.vx = hero.vy = 0; hero.dodge = 0; hero.ww = 0; hero.atkTimer = 0;
    hero.hp = Math.max(hero.hp, stats.maxHp * 0.55);
    hero.invuln = 0.8;
    staticSeed = 2000 + run.act * 37 + id.length * 13 + run.rooms * 7;
    buildStatic();
    mode = 'room';
    // 走廊与传送门房：无战斗，进门即可通行
    if (room.type === 'corridor' || room.type === 'portal') {
      room.cleared = true;
      room.gateOpen = true;
    }
    saveGame();
  }

  function spawnWave() {
    room.wave++;
    if (room.wave >= room.def.waves.length) return;
    var kinds = room.def.waves[room.wave].slice();
    if (run.event && run.event.id === 'rift' && room.type !== 'boss') kinds.push(pick(['slime', 'archer', 'guard']));
    for (var i = 0; i < kinds.length; i++) {
      var pos = spawnPos(i, kinds.length);
      spawnEnemy(kinds[i], pos.x, pos.y);
    }
    room.waveTimer = 1.4;
  }

  function spawnPos(i, n) {
    // 从左右两侧与上方门口涌入，避免出生在玩家脚下
    var side = i % 3;
    if (side === 0) return { x: ARENA.x0 + 60 + rnd(0, 70), y: ARENA.y0 + 70 + rnd(0, ARENA.y1 - ARENA.y0 - 140) };
    if (side === 1) return { x: ARENA.x1 - 60 - rnd(0, 70), y: ARENA.y0 + 70 + rnd(0, ARENA.y1 - ARENA.y0 - 140) };
    return { x: W / 2 + rnd(-120, 120), y: ARENA.y0 + 46 };
  }

  function spawnEnemy(kind, x, y) {
    var d = ENEMY[kind];
    if (!d) return null;
    var actScale = 1 + (run.act - 1) * 0.14;
    var ngScale = 1 + run.ng * R.ngPlusScale;
    var e = {
      kind: kind, x: x, y: y, vx: 0, vy: 0, r: d.r, size: d.size, sprite: d.sprite,
      hp: Math.round(d.hp * actScale * ngScale), maxHp: 0, dmg: d.dmg * (1 + (run.act - 1) * 0.08) * (1 + run.ng * 0.1),
      speed: d.speed, gold: d.gold, name: d.name,
      state: 'spawn', t: 0.5, spawnT: 0.5, flash: 0, stun: 0, slow: 0, slowT: 0,
      act: null, cool: rnd(0.4, 1.2), dir: PI, phase: 1, enraged: false,
      hitCd: 0, wob: rnd(0, TAU), hurtT: 0, dead: false, shootCd: 3, lastHitBy: ''
    };
    e.maxHp = e.hp;
    if (kind === 'boss') e.name = '魔王卡奥斯';
    if (kind === 'warden') e.name = '裂隙督军';
    enemies.push(e);
    effects.push({ type: 'spawnring', x: x, y: y, r: 10, life: 0.5, age: 0, color: '#a86bff' });
    return e;
  }

  function aliveEnemies() {
    var out = [];
    for (var i = 0; i < enemies.length; i++) if (!enemies[i].dead && enemies[i].state !== 'spawn') out.push(enemies[i]);
    return out;
  }

  function roomExpTarget(r) {
    if (!r || !r.def || !r.def.waves) return 0;
    var n = 0;
    for (var w = 0; w < r.def.waves.length; w++) {
      n += r.def.waves[w].length;
      if (run.event && run.event.id === 'rift' && r.type !== 'boss') n += 1;
    }
    return n;
  }

  function roomCleared() {
    room.cleared = true;
    run.rooms++;
    var gold = 26 + run.act * 12;
    if (run.event && run.event.id === 'escort') gold += 35;
    run.gold += gold;
    score += 100;
    levelUp();
    sfx.gate();
    effects.push({ type: 'ring', x: W / 2, y: ARENA.y0 + 40, r: 10, life: 0.8, age: 0, color: '#ffe6a6' });
    if (switchesDone()) {
      room.gateOpen = true;
    } else {
      toastMsg('裂隙机关未启动 —— 找到 ' + room.switches.length + ' 处机关');
    }
    if (room.type === 'elite') { grantRelic(); dropItem(1); }
    else if (Math.random() < 0.4) dropItem(0);
    saveGame();
    if (room.type === 'boss') { bossDefeated(); return; }
    if (room.type === 'elite') {
      openReward(function () { openHub(); });
    } else {
      openReward(function () { /* 门开与否取决于机关 */ });
    }
  }

  function switchesDone() {
    if (!room || !room.switches) return true;
    for (var i = 0; i < room.switches.length; i++) if (!room.switches[i].on) return false;
    return true;
  }

  function grantRelic() {
    var pool = [];
    for (var i = 0; i < RELICS.length; i++) if (run.relics.indexOf(RELICS[i].id) < 0) pool.push(RELICS[i]);
    if (!pool.length) return;
    var r = pick(pool);
    run.relics.push(r.id);
    growStats(function () {});
    sfx.rune();
    banner = { text: '遗物 · ' + r.name, sub: r.desc, t: 0, life: 3.2 };
    effects.push({ type: 'ring', x: W / 2, y: ARENA.y0 + 60, r: 10, max: 240, life: 0.7, age: 0, color: '#c8a4ff' });
  }

  /* 装备掉落：精英至少稀有，普通房 40% 概率 */
  function dropItem(minRank) {
    var item = makeItem(Math.max(1, run.level - 1), minRank);
    if (run.bag.length >= BAG_MAX) {
      var worst = -1, worstScore = 99;
      for (var i = 0; i < run.bag.length; i++) {
        var sc = itemScore(run.bag[i]);
        if (sc < worstScore) { worstScore = sc; worst = i; }
      }
      if (worst >= 0 && worstScore < itemScore(item)) {
        var salvaged = run.bag.splice(worst, 1)[0];
        run.gold += 20;
        toastMsg('背包已满 · 分解 ' + salvaged.name + ' 换 20 金币');
      } else {
        run.gold += 20;
        toastMsg('背包已满 · ' + item.name + ' 自动分解为 20 金币');
        return;
      }
    }
    run.bag.push(item);
    sfx.rune();
    effects.push({ type: 'ring', x: W / 2, y: ARENA.y0 + 70, r: 10, max: 200, life: 0.6, age: 0, color: QUALITY[item.rarity].color });
    toastMsg('装备掉落 · ' + item.name + '（需求 Lv.' + item.ilvl + '）');
  }

  function equipItem(idx) {
    var item = run.bag[idx];
    if (!item) return;
    if (run.level < item.ilvl) { toastMsg('等级不足：' + item.name + ' 需要 Lv.' + item.ilvl); sfx.hurt(); return; }
    var old = run.equipped[item.slot];
    run.bag.splice(idx, 1);
    run.equipped[item.slot] = item;
    if (old) run.bag.push(old);
    growStats(function () {});
    sfx.rune();
    toastMsg('已装备 ' + item.name);
    buildHubRows();
  }

  function levelUp() {
    var oldMax = stats.maxHp, oldMp = stats.maxMp;
    run.level++;
    run.talentPoints++;
    recalcStats();
    // 新上限直接补进当前值，再按文档回复 25%
    hero.hp = Math.min(stats.maxHp, hero.hp + Math.max(0, stats.maxHp - oldMax) + stats.maxHp * 0.25);
    hero.mp = Math.min(stats.maxMp, hero.mp + Math.max(0, stats.maxMp - oldMp) + stats.maxMp * 0.25);
    sfx.levelup();
    toastMsg('等级提升 · Lv.' + run.level + '  （天赋点 +1）');
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 10, life: 0.7, age: 0, color: '#ffd874' });
    if (run.level === 10) { banner = { text: '武器形态 · 觉醒', sub: '断剑重铸，剑锋更长', t: 0, life: 3 }; invalidateCharCache(); }
    if (run.level === 15) { banner = { text: '终极技能 · 星辉爆裂', sub: '按 T 释放', t: 0, life: 3 }; }
  }

  function nextRoom() {
    var act = ACTS[run.act - 1];
    if (act.graph) {
      var node = act.graph.nodes[run.node] || {};
      var nxt = node.next || [];
      if (!nxt.length) { openHub(); return; }
      if (nxt.length === 1) { startNode(nxt[0]); return; }
      openPath(nxt);
      return;
    }
    if (run.room + 1 >= act.rooms.length) { openHub(); return; }
    startRoom(run.room + 1);
  }

  function doInteract() {
    if (mode !== 'room' || !room) return;
    var i;
    // 裂隙机关：随时可以启动，开门仍需清场
    for (i = 0; i < room.switches.length; i++) {
      var sw = room.switches[i];
      if (!sw.on && dist(hero.x, hero.y, sw.x, sw.y) < 78) {
        sw.on = true;
        sw.glow = 1;
        sfx.rune();
        effects.push({ type: 'ring', x: sw.x, y: sw.y, r: 8, max: 96, life: 0.55, age: 0, color: '#9fe8ff' });
        if (switchesDone() && room.cleared) {
          room.gateOpen = true;
          sfx.gate();
          toastMsg('双机关联动 · 门开了');
        } else if (switchesDone()) {
          toastMsg('双机关已就位，清场后开门');
        } else {
          var on = 0;
          for (var k = 0; k < room.switches.length; k++) if (room.switches[k].on) on++;
          toastMsg('机关启动 ' + on + '/' + room.switches.length);
        }
        return;
      }
    }
    // 传送门：双向捷径，走到门前按 F
    if (room.portal && dist(hero.x, hero.y, room.portal.x, room.portal.y) < 96) {
      sfx.gate();
      startNode(room.portal.to);
      return;
    }
    if (room.backPortal && dist(hero.x, hero.y, room.backPortal.x, room.backPortal.y) < 96) {
      sfx.gate();
      startNode(room.backPortal.to);
      return;
    }
    // 战斗中按 F 也要给反馈，避免玩家以为按键失灵
    if (!room.cleared) { toastMsg('门还锁着 —— 先清场'); return; }
    if (!switchesDone()) { toastMsg('清场了，但机关还没启动'); return; }
    if (dist(hero.x, hero.y, W / 2, ARENA.y0 + 26) < 130) {
      nextRoom();
    } else {
      toastMsg('走到上方的门前按 F');
    }
  }

  /* ============================================================
   * 11. 奖励三选一
   * ============================================================ */
  var rewardAfter = null;

  function openReward(after) {
    rewardAfter = after || null;
    cards = rollCards();
    cardIndex = 0;
    mode = 'reward';
    paused = false;
    panelGuardUntil = performance.now() + 400;
  }

  function rollCards() {
    var out = [];
    var availRunes = RUNES.filter(function (r) { return !run.runes[r.skill] && run.level >= 3; });
    var availAffixes = AFFIXES.filter(function (a) { return run.affixes.indexOf(a.id) < 0; });
    if (availRunes.length) {
      var r = pick(availRunes);
      out.push({ kind: 'rune', id: r.id, name: r.name, desc: r.desc, cat: '技能符文', color: '#ffd874' });
    }
    while (out.length < 3 && availAffixes.length) {
      var idx = Math.floor(Math.random() * availAffixes.length);
      var a = availAffixes.splice(idx, 1)[0];
      out.push({ kind: 'affix', id: a.id, name: a.name, desc: a.desc, cat: a.cat, color: affixColor(a.cat) });
    }
    while (out.length < 3) {
      out.push({ kind: 'gold', id: 'gold', name: '金币袋', desc: '获得 60 金币', cat: '补给', color: '#ffd874' });
    }
    return out;
  }

  function affixColor(cat) {
    if (cat === '进攻') return '#ff9d7a';
    if (cat === '防御') return '#8fd0ff';
    if (cat === '资源') return '#a6f0c8';
    return '#c8b4ff';
  }

  function pickCard(i) {
    if (mode !== 'reward' || !cards[i]) return;
    var c = cards[i];
    growStats(function () {
      if (c.kind === 'rune') {
        var r = RUNES.find(function (x) { return x.id === c.id; });
        if (r) run.runes[r.skill] = r.id;
      } else if (c.kind === 'affix') {
        run.affixes.push(c.id);
      } else if (c.kind === 'gold') {
        run.gold += 60;
      }
    });
    sfx.rune();
    toastMsg('获得 ' + c.name);
    mode = 'room';
    cards = [];
    if (rewardAfter) { var f = rewardAfter; rewardAfter = null; f(); }
  }

  /* ============================================================
   * 11b. 房间网络：岔路口选择
   * ============================================================ */
  var pathOptions = [], pathIndex = 0;

  function openPath(ids) {
    pathOptions = ids.slice();
    pathIndex = 0;
    mode = 'path';
    panelGuardUntil = performance.now() + 400;
    sfx.click();
  }

  function choosePath(i) {
    if (mode !== 'path') return;
    var act = graphAct();
    if (!act) { mode = 'room'; return; }
    var id = pathOptions[clamp(i, 0, pathOptions.length - 1)];
    if (!act.graph.nodes[id]) return;
    mode = 'room';
    startNode(id);
  }

  /* ============================================================
   * 12. 回城（交任务 / 锻造 / 商店 / 天赋）
   * ============================================================ */
  function openHub() {
    mode = 'hub';
    hub.index = 0;
    hub.sub = null;
    buildHubRows();
    saveGame();
    sfx.gate();
  }

  function buildHubRows() {
    var rows = [];
    if (!run.questDone[run.act]) {
      rows.push({ id: 'quest', label: '交任务 · ' + questName(run.act), right: '可交付', color: '#ffd874' });
    }
    rows.push({ id: 'weapon', label: '锻造 · 武器 +攻击', right: forgeCost(run.forgeW) + 'G', color: '#ff9d7a' });
    rows.push({ id: 'armor', label: '锻造 · 护甲 +生命', right: forgeCost(run.forgeA) + 'G', color: '#8fd0ff' });
    rows.push({ id: 'potion', label: '商店 · 购买药水', right: R.potionCost + 'G', color: '#a6f0c8' });
    var eqCount = 0;
    for (var s = 0; s < EQUIP_SLOTS.length; s++) if (run.equipped[EQUIP_SLOTS[s]]) eqCount++;
    rows.push({ id: 'equip', label: '装备 · ' + eqCount + '/3 槽位', right: run.bag.length + ' 件待选', color: '#ffd874' });
    rows.push({ id: 'codex', label: '图鉴 · 怪物', right: codexSeen() + '/7', color: '#c8b4ff' });
    rows.push({ id: 'talent', label: '天赋 · ' + (run.talentLine ? TALENTS[run.talentLine].name + ' ' + run.talentLevel + '/5' : '三系互斥'), right: '点数 ' + run.talentPoints, color: '#c8b4ff' });
    if (run.talentLevel > 0) {
      rows.push({ id: 'respec', label: '洗点 · 重置天赋', right: respecCost() + 'G', color: '#ffb0d0' });
    }
    rows.push({ id: 'save', label: '手动存档', right: '已自动保存', color: '#9aa4b8' });
    rows.push({ id: 'leave', label: '出发 · 前往下一幕', right: '>>', color: '#ffe6a6' });
    hub.rows = rows;
  }

  function respecCost() { return 40 + run.talentLevel * 25; }

  function questName(act) {
    return ['', '石像的回忆', '暮光的追踪', '裂隙的真相', '王座的复仇'][act] || '圣殿委托';
  }

  function forgeCost(lv) { return Math.round(60 * Math.pow(1.55, lv)); }

  function hubKey(k) {
    if (hub.sub === 'codex') {
      if (k === 'escape' || k === 'backspace' || k === 'x' || k === 'enter' || k === 'f') { hub.sub = null; buildHubRows(); }
      return;
    }
    if (hub.sub === 'talent') {
      if (k === '1' || k === '2' || k === '3') pickTalent(['berserk', 'aegis', 'star'][parseInt(k, 10) - 1]);
      if (k === 'escape' || k === 'backspace' || k === 'x') { hub.sub = null; buildHubRows(); }
      return;
    }
    if (hub.sub === 'equip') {
      if (k >= '1' && k <= '6') { equipItem(parseInt(k, 10) - 1); return; }
      if (k === 'escape' || k === 'backspace' || k === 'x') { hub.sub = null; buildHubRows(); return; }
      return;
    }
    if (k === 'arrowup' || k === 'w') { hub.index = (hub.index + hub.rows.length - 1) % hub.rows.length; sfx.click(); return; }
    if (k === 'arrowdown' || k === 's') { hub.index = (hub.index + 1) % hub.rows.length; sfx.click(); return; }
    if (k === 'enter' || k === 'f' || k === ' ') { hubDo(hub.rows[hub.index].id); return; }
    if (k >= '1' && k <= '9') {
      var idx = parseInt(k, 10) - 1;
      if (idx < hub.rows.length) { hub.index = idx; hubDo(hub.rows[idx].id); }
    }
  }

  function hubDo(id) {
    if (mode !== 'hub') return;
    if (id === 'quest') {
      if (run.questDone[run.act]) { toastMsg('本幕任务已交付'); return; }
      var gold = 70 + run.act * 40;
      run.gold += gold; run.questDone[run.act] = true;
      run.talentPoints += 2;
      score += 50;
      sfx.levelup();
      toastMsg('任务完成 · 获得 ' + gold + ' 金币与 2 点天赋');
    } else if (id === 'weapon') {
      var cost = forgeCost(run.forgeW);
      if (run.gold < cost) { toastMsg('金币不足'); sfx.hurt(); return; }
      growStats(function () { run.gold -= cost; run.forgeW++; });
      sfx.rune();
      toastMsg('武器强化 +1 · 攻击提升');
    } else if (id === 'armor') {
      var cost2 = forgeCost(run.forgeA);
      if (run.gold < cost2) { toastMsg('金币不足'); sfx.hurt(); return; }
      growStats(function () { run.gold -= cost2; run.forgeA++; });
      sfx.rune(); toastMsg('护甲强化 +1 · 生命 +8');
    } else if (id === 'potion') {
      if (run.gold < R.potionCost) { toastMsg('金币不足'); sfx.hurt(); return; }
      run.gold -= R.potionCost; run.potions++; sfx.potion();
      toastMsg('药水 +1');
    } else if (id === 'equip') {
      hub.sub = 'equip';
      sfx.click();
      return;
    } else if (id === 'codex') {
      hub.sub = 'codex';
      sfx.click();
      return;
    } else if (id === 'talent') {
      if (run.talentPoints <= 0) { toastMsg('没有天赋点'); return; }
      if (run.talentLine && run.talentLevel >= 5) { toastMsg('该系已满级，可洗点转系'); return; }
      hub.sub = 'talent'; sfx.click();
      return;
    } else if (id === 'respec') {
      var rc = respecCost();
      if (run.talentLevel <= 0) { toastMsg('尚未投入天赋'); return; }
      if (run.gold < rc) { toastMsg('金币不足'); sfx.hurt(); return; }
      run.gold -= rc;
      run.talentPoints += run.talentLevel;
      run.talentLine = null;
      run.talentLevel = 0;
      recalcStats();
      hero.hp = Math.min(hero.hp, stats.maxHp);
      sfx.rune();
      toastMsg('已洗点 · 天赋点已返还');
    } else if (id === 'save') {
      saveGame(); toastMsg('已手动存档');
    } else if (id === 'leave') {
      if (run.act >= 4) { mode = 'room'; return; }
      var next = run.act + 1;
      if (next === 3) {
        story = [
          { t: '第三幕 · 裂隙真相', s: '裂隙深处，星辉核心的低语揭开了尘封的记载。' },
          { t: '卡奥斯·晨星', s: '魔王曾是圣殿的首席骑士。星辉核心以持有者的生命为食，圣殿隐瞒了这一切。' }
        ];
        storyIndex = 0; mode = 'story';
        storyAfter = function () { beginAct(3); };
        return;
      }
      beginAct(next);
      return;
    }
    buildHubRows();
    hub.index = Math.min(hub.index, hub.rows.length - 1);
  }

  function pickTalent(line) {
    if (!TALENTS[line] || run.talentPoints <= 0) return;
    if (run.talentLine && run.talentLine !== line) { toastMsg('天赋三系互斥'); return; }
    if (run.talentLevel >= 5) { toastMsg('该系已满级'); return; }
    run.talentLine = line;
    run.talentLevel++;
    run.talentPoints--;
    growStats(function () {});
    hero.hp = Math.min(stats.maxHp, hero.hp + 15);
    sfx.rune();
    toastMsg(TALENTS[line].name + ' · ' + TALENTS[line].levels[run.talentLevel - 1].name);
    hub.sub = null;
    buildHubRows();
  }

  /* ============================================================
   * 13. 玩家动作
   * ============================================================ */
  function attackAim() {
    var best = null, bd = 210;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'spawn') continue;
      var d = dist(e.x, e.y, hero.x, hero.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) return Math.atan2(best.y - hero.y, best.x - hero.x);
    return hero.face;
  }

  function doAttack() {
    if (mode !== 'room' || !room) return;
    if (hero.dodge > 0) return;
    if (hero.atkTimer > 0) {
      // 连段窗口：仅在后摇允许接续
      if (hero.atkTimer > hero.atkDur * 0.45) return;
    }
    if (hero.comboTimer <= 0) hero.combo = 0;
    var idx = hero.combo % 3;
    hero.combo = idx + 1;
    hero.comboTimer = 0.62;
    hero.atkIndex = idx;
    hero.atkDur = (idx === 2 ? 0.46 : 0.30) / (1 + stats.atkSpeed);
    hero.atkTimer = hero.atkDur;
    hero.atkHit = false;
    hero.atkDir = attackAim();
    hero.face = hero.atkDir;
    sfx.whiff();
  }

  function performSwing() {
    var idx = hero.atkIndex;
    var mult = idx === 2 ? 1.8 : 1.0;
    var reach = 96 * stats.reach * (idx === 2 ? 1.12 : 1) * (idx === 2 && stats.combo3range ? 1 + stats.combo3range : 1);
    var half = idx === 2 ? 1.25 : 1.0;
    var dmg = stats.atkMul * R.attackDamage * mult * (stats.lowRage && hero.hp < stats.maxHp * 0.5 ? 1 + stats.lowRage : 1);
    var hits = 0;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'spawn') continue;
      var d = dist(e.x, e.y, hero.x, hero.y);
      if (d > reach + e.r) continue;
      var a = Math.atan2(e.y - hero.y, e.x - hero.x);
      if (Math.abs(angDiff(a, hero.atkDir)) > half) continue;
      damageEnemy(e, dmg, { crit: hero.critNext > 0, heavy: idx === 2, dir: a, root: 'swing' });
      hits++;
      if (idx === 2 && e.kind !== 'boss') { e.stun = Math.max(e.stun, 0.5); e.vx += Math.cos(a) * 210; e.vy += Math.sin(a) * 210; }
      if (stats.leech > 0) healHero(dmg * stats.leech, true);
    }
    if (hero.critNext > 0 && hits > 0) hero.critNext = 0;
    effects.push({ type: 'slash', x: hero.x, y: hero.y, dir: hero.atkDir, r: reach, arc: half * 2, life: 0.2, age: 0, idx: idx });
    if (hits === 0) sfx.whiff();
    if (idx === 2 && stats.splash) {
      for (var j = 0; j < enemies.length; j++) {
        var e2 = enemies[j];
        if (e2.dead || e2.state === 'spawn') continue;
        if (dist(e2.x, e2.y, hero.x, hero.y) < reach + 40) damageEnemy(e2, dmg * 0.55, { dir: Math.atan2(e2.y - hero.y, e2.x - hero.x), root: 'splash' });
      }
      effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 20, max: reach + 40, life: 0.35, age: 0, color: '#ffe6a6' });
    }
    if (hits > 0) {
      hitstop = Math.max(hitstop, idx === 2 ? 0.10 : 0.06);
      shake = Math.max(shake, idx === 2 ? 9 : 4);
      pushX += Math.cos(hero.atkDir) * (idx === 2 ? 8 : 3);
      pushY += Math.sin(hero.atkDir) * (idx === 2 ? 8 : 3);
    }
  }

  function doDodge() {
    if (mode !== 'room' || !room) return;
    if (hero.dodgeCd > 0 || hero.dodge > 0) return;
    var mx = 0, my = 0;
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright'] || keys['d']) mx += 1;
    if (keys['arrowup'] || keys['w']) my -= 1;
    if (keys['arrowdown'] || keys['s']) my += 1;
    if (joystick && Math.hypot(joystick.dx, joystick.dy) > 12) { mx = joystick.dx; my = joystick.dy; }
    if (mx === 0 && my === 0) mx = Math.cos(hero.face), my = Math.sin(hero.face);
    hero.dodgeDir = Math.atan2(my, mx);
    hero.face = hero.dodgeDir;
    hero.dodge = 0.22;
    hero.dodgeT = 0;
    hero.invuln = Math.max(hero.invuln, stats.dodgeInvuln);
    hero.dodgeWindow = stats.perfectWin;
    hero.dodgeCd = R.dodgeCooldown * stats.dodgeCdMul;
    hero.atkTimer = 0;
    if (stats.dodgeTrap && hazards.length < 30) {
      hazards.push({ type: 'trap', x: hero.x, y: hero.y, r: 54, life: 3, age: 0, dmg: 0, slow: 1 });
    }
    sfx.dodge();
  }

  function perfectDodge() {
    hero.dodgeWindow = 0;
    slowmo = 0.6 + stats.perfectSlow;
    hero.mp = Math.min(stats.maxMp, hero.mp + 25);
    hero.critNext = stats.perfectCrit ? 4.0 : 2.0;
    hero.perfectCount = (hero.perfectCount || 0) + 1;
    if (stats.shieldOnPerfect) hero.shield = Math.max(hero.shield, stats.shieldOnPerfect);
    shake = Math.max(shake, 6);
    flashWhite = Math.max(flashWhite, 0.18);
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 12, max: 120, life: 0.5, age: 0, color: '#9fe8ff' });
    addFloater(hero.x, hero.y - 60, '完美闪避', '#9fe8ff', 26);
    sfx.perfect();
    score += 5;
  }

  /* 弹反：格挡起手 0.15s 内挡到攻击，免伤并反打最近的敌人 */
  function doParry(sx, sy) {
    hero.guardT = 99; // 本次格挡已完成弹反，避免同一帧重复触发
    hero.mp = Math.min(stats.maxMp, hero.mp + 15);
    hero.critNext = Math.max(hero.critNext, 1.5);
    hero.invuln = Math.max(hero.invuln, 0.35);
    hitstop = Math.max(hitstop, 0.10);
    shake = Math.max(shake, 11);
    slowmo = Math.max(slowmo, 0.22);
    flashWhite = Math.max(flashWhite, 0.20);
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 12, max: 155, life: 0.45, age: 0, color: '#ffe6a6' });
    addFloater(hero.x, hero.y - 62, '弹反 +15 法力', '#ffe6a6', 24);
    sfx.parry();
    var target = null, td = 1e9;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'spawn') continue;
      var dd = dist(e.x, e.y, hero.x, hero.y);
      if (dd < 230 && dd < td) { td = dd; target = e; }
    }
    if (target) {
      damageEnemy(target, stats.atkMul * R.attackDamage * 2.2, {
        crit: true, heavy: true, dir: Math.atan2(target.y - hero.y, target.x - hero.x), root: 'parry'
      });
      if (target.kind !== 'boss') {
        target.stun = Math.max(target.stun, 0.9);
        target.vx += Math.cos(Math.atan2(target.y - hero.y, target.x - hero.x)) * 260;
        target.vy += Math.sin(Math.atan2(target.y - hero.y, target.x - hero.x)) * 260;
      }
    }
    score += 10;
  }

  function doWhirlwind() {
    if (mode !== 'room' || !room) return;
    if (hero.wwcd > 0) { toastMsg('旋风斩冷却中'); return; }
    if (hero.mp < R.whirlwindCost) { toastMsg('法力不足'); sfx.hurt(); return; }
    hero.mp -= R.whirlwindCost;
    hero.wwcd = R.whirlwindCooldown * stats.cdr;
    hero.ww = 0.45;
    hero.wwTick = 0;
    hero.atkTimer = 0;
    sfx.ww();
  }

  function whirlwindTick() {
    var r = stats.wwRadius;
    var dmg = stats.atkMul * R.attackDamage * 1.05 * stats.skillMul;
    var hits = 0;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'spawn') continue;
      if (dist(e.x, e.y, hero.x, hero.y) > r + e.r) continue;
      var a = Math.atan2(e.y - hero.y, e.x - hero.x);
      damageEnemy(e, dmg, { dir: a, root: 'whirl' });
      if (stats.wwKnock && e.kind !== 'boss') { e.vx += Math.cos(a) * 160; e.vy += Math.sin(a) * 160; }
      if (stats.wwLeech) healHero(stats.wwLeech, true);
      hits++;
    }
    if (stats.wwFire && hazards.length < 40) {
      hazards.push({ type: 'fire', x: hero.x, y: hero.y, r: 30, life: 2.4, age: 0, dmg: stats.atkMul * R.attackDamage * 0.4, tick: 0 });
    }
    if (hits > 0) {
      hitstop = Math.max(hitstop, 0.04);
      shake = Math.max(shake, 4);
    }
  }

  function doRetribution() {
    if (mode !== 'room' || !room) return;
    if (hero.rbcd > 0) { toastMsg('圣光惩戒冷却中'); return; }
    if (hero.mp < R.retributionCost) { toastMsg('法力不足'); sfx.hurt(); return; }
    hero.mp -= R.retributionCost;
    hero.rbcd = R.retributionCooldown * stats.cdr;
    hero.atkTimer = 0;
    var targets = [];
    var pool = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead && enemies[i].state !== 'spawn') pool.push(enemies[i]);
    }
    pool.sort(function (a, b) { return dist(a.x, a.y, hero.x, hero.y) - dist(b.x, b.y, hero.x, hero.y); });
    if (pool.length && dist(pool[0].x, pool[0].y, hero.x, hero.y) < 480) {
      targets.push(pool[0]);
      var n = 1 + stats.rbChain;
      while (targets.length < n && targets.length < pool.length) {
        var last = targets[targets.length - 1];
        var next = null, nd = 320;
        for (var j = 0; j < pool.length; j++) {
          if (targets.indexOf(pool[j]) >= 0) continue;
          var d = dist(pool[j].x, pool[j].y, last.x, last.y);
          if (d < nd) { nd = d; next = pool[j]; }
        }
        if (!next) break;
        targets.push(next);
      }
    }
    var base = stats.atkMul * R.attackDamage * 3.2 * (1 + stats.rbSingle) * stats.skillMul;
    var prev = { x: hero.x, y: hero.y - 26 };
    for (var t = 0; t < targets.length; t++) {
      var e = targets[t];
      effects.push({ type: 'beam', x0: prev.x, y0: prev.y, x1: e.x, y1: e.y, life: 0.28, age: 0, color: '#bff0ff' });
      damageEnemy(e, base, { crit: true, heavy: true, dir: Math.atan2(e.y - hero.y, e.x - hero.x), root: 'judge' });
      if (stats.rbStun) e.stun = Math.max(e.stun, stats.rbStun);
      prev = e;
    }
    if (!targets.length) {
      effects.push({ type: 'beam', x0: hero.x, y0: hero.y - 26, x1: hero.x + Math.cos(hero.face) * 300, y1: hero.y + Math.sin(hero.face) * 300, life: 0.28, age: 0, color: '#bff0ff' });
    }
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 14, max: 90, life: 0.4, age: 0, color: '#9fe8ff' });
    hitstop = Math.max(hitstop, 0.09);
    shake = Math.max(shake, 8);
    sfx.rb();
  }

  function doUltimate() {
    if (mode !== 'room' || !room) return;
    if (!stats.ultUnlock) { toastMsg('15 级解锁终极技能'); return; }
    if (hero.ultcd > 0) { toastMsg('星辉爆裂冷却中'); return; }
    if (hero.mp < R.ultimateCost) { toastMsg('法力不足'); sfx.hurt(); return; }
    hero.mp -= R.ultimateCost;
    hero.ultcd = R.ultimateCooldown * stats.cdr;
    var dmg = stats.atkMul * R.attackDamage * 5.2 * stats.skillMul;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'spawn') continue;
      if (dist(e.x, e.y, hero.x, hero.y) > 260 + e.r) continue;
      damageEnemy(e, dmg, { crit: true, heavy: true, dir: Math.atan2(e.y - hero.y, e.x - hero.x), root: 'ult' });
    }
    hazards.length = 0;
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 20, max: 300, life: 0.7, age: 0, color: '#ffe6a6' });
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 10, max: 200, life: 0.5, age: 0, color: '#bff0ff' });
    healHero(20, true);
    flashWhite = 0.25;
    shake = 18; hitstop = 0.14;
    sfx.ult();
  }

  function doPotion() {
    if (mode !== 'room') return;
    if (run.potions <= 0) { toastMsg('没有药水了（回城可购买）'); return; }
    if (hero.potionCd > 0) { toastMsg('药水冷却中'); return; }
    if (hero.hp >= stats.maxHp) { toastMsg('生命已满'); return; }
    run.potions--;
    hero.potionCd = stats.potionCd;
    healHero(stats.potionHeal, false);
    effects.push({ type: 'ring', x: hero.x, y: hero.y, r: 10, max: 70, life: 0.45, age: 0, color: '#a6f0c8' });
    sfx.potion();
  }

  function healHero(v, quiet) {
    if (v <= 0) return;
    var before = hero.hp;
    hero.hp = Math.min(stats.maxHp, hero.hp + v);
    if (!quiet && hero.hp - before > 0.5) addFloater(hero.x, hero.y - 56, '+' + Math.round(hero.hp - before), '#a6f0c8', 22);
  }

  function addFloater(x, y, text, color, size) {
    floaters.push({ x: x, y: y, text: text, color: color || '#fff', age: 0, life: 0.9, size: size || 24 });
  }

  /* ============================================================
   * 14. 伤害结算
   * ============================================================ */
  function damageEnemy(e, dmg, o) {
    if (e.dead) return false;
    o = o || {};
    var crit = !!o.crit || Math.random() < stats.crit;
    var d = dmg;
    if (crit) d *= stats.critDmg;
    if (stats.exec && e.hp < e.maxHp * 0.3) d *= 1 + stats.exec;
    if (e.enraged) d *= 1;
    d = Math.max(1, Math.round(d));
    e.hp -= d;
    e.flash = 0.12;
    e.hurtT = 0.2;
    e.lastHitBy = o.root || '';
    if (o.dir !== undefined && e.kind !== 'boss' && e.state !== 'charge') {
      var kb = (o.heavy ? 210 : 90) * (e.kind === 'elite' || e.kind === 'warden' ? 0.35 : 1);
      e.vx += Math.cos(o.dir) * kb;
      e.vy += Math.sin(o.dir) * kb;
    }
    if (e.kind !== 'boss' && e.kind !== 'elite' && e.kind !== 'warden' && e.state !== 'charge') {
      e.stun = Math.max(e.stun, o.heavy ? 0.28 : 0.10);
    }
    addFloater(e.x + rnd(-8, 8), e.y - e.size * 0.55, (crit ? '' : '') + d, crit ? '#ffe6a6' : '#ffffff', crit ? 30 : 23);
    for (var i = 0; i < (crit ? 10 : 5); i++) {
      var a = rnd(0, TAU), sp = rnd(60, 200);
      effects.push({ type: 'spark', x: e.x, y: e.y - e.size * 0.35, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.2, 0.45), age: 0, color: crit ? '#ffe6a6' : '#cfe0ff' });
    }
    if (crit) sfx.crit(); else sfx.hit();
    if (e.hp <= 0) { killEnemy(e); return true; }
    if (e.kind === 'boss') bossPhaseCheck(e);
    return false;
  }

  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    run.kills++;
    var cxk = getCodex();
    cxk[e.kind] = (cxk[e.kind] || 0) + 1;
    if (room && room.expTotal > 0 && run.expKills < room.expTotal) run.expKills++;
    score += 10;
    if (stats.killHeal) healHero(stats.killHeal, true);
    var n = e.kind === 'boss' ? 14 : (e.kind === 'elite' || e.kind === 'warden' ? 6 : 3);
    for (var i = 0; i < n; i++) {
      drops.push({ x: e.x + rnd(-14, 14), y: e.y + rnd(-10, 10), vx: rnd(-70, 70), vy: rnd(-90, -20), age: 0, life: 0.9, value: Math.max(1, Math.round(e.gold / n)), z: 0 });
    }
    for (var j = 0; j < 18; j++) {
      var a = rnd(0, TAU), sp = rnd(50, 260);
      effects.push({ type: 'spark', x: e.x, y: e.y - e.size * 0.3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.7), age: 0, color: e.kind === 'boss' ? '#ffd874' : '#a86bff' });
    }
    effects.push({ type: 'ring', x: e.x, y: e.y, r: 6, max: e.size * 0.8, life: 0.4, age: 0, color: '#a86bff' });
    sfx.kill();
    if (stats.rbBoom && e.lastHitBy === 'judge') {
      for (var k = 0; k < enemies.length; k++) {
        if (enemies[k] !== e && !enemies[k].dead && dist(enemies[k].x, enemies[k].y, e.x, e.y) < 140) {
          damageEnemy(enemies[k], stats.atkMul * R.attackDamage * 0.8, {});
        }
      }
      effects.push({ type: 'ring', x: e.x, y: e.y, r: 10, max: 150, life: 0.35, age: 0, color: '#bff0ff' });
    }
    if (e.kind === 'boss') {
      shake = 24; hitstop = 0.20; flashWhite = 0.4;
      for (var m = 0; m < 40; m++) {
        var a2 = rnd(0, TAU), sp2 = rnd(40, 340);
        effects.push({ type: 'spark', x: e.x, y: e.y - 60, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2, life: rnd(0.4, 1.1), age: 0, color: '#ffe6a6' });
      }
    }
  }

  function damageHero(dmg, sx, sy, opts) {
    if (mode !== 'room') return;
    if (R.godMode >= 1) return;
    if (hero.dodgeWindow > 0) { perfectDodge(); return; }
    if (hero.invuln > 0) return;
    var d = dmg * (1 - stats.armor) * stats.damageTakenMul;
    // 格挡：举起盾的瞬间（0.15s 内）被打到 = 弹反；之后只减伤 60%
    if (hero.guard) {
      if (hero.guardT <= 0.15) { doParry(sx, sy); return; }
      d *= 0.4;
      addFloater(hero.x, hero.y - 52, '格挡 -' + Math.max(1, Math.round(d)), '#9fd8ff', 20);
      sfx.click();
    }
    if (hero.shield > 0) {
      var abs = Math.min(hero.shield, d);
      hero.shield -= abs;
      d -= abs;
      if (d <= 0) { addFloater(hero.x, hero.y - 50, '格挡', '#8fd0ff', 22); return; }
    }
    d = Math.max(1, Math.round(d));
    hero.hp -= d;
    hero.flash = 0.14;
    hero.hurtT = 0.25;
    hero.invuln = 0.85;
    shake = Math.max(shake, 12);
    hitstop = Math.max(hitstop, 0.08);
    addFloater(hero.x, hero.y - 58, '-' + d, '#ff8a7a', 28);
    sfx.hurt();
    vignettePulse = 0.5;
    if (sx !== undefined) {
      var a = Math.atan2(hero.y - sy, hero.x - sx);
      hero.vx += Math.cos(a) * 190;
      hero.vy += Math.sin(a) * 190;
    }
    if (stats.thorns > 0) {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.dead && dist(e.x, e.y, hero.x, hero.y) < 110) damageEnemy(e, stats.thorns, {});
      }
    }
    if (hero.hp <= 0) { hero.hp = 0; heroDied(); }
  }

  function heroDied() {
    mode = 'dead';
    phase = 'lost';
    paused = false;
    var lost = Math.floor(run.gold * R.goldLossOnDeath);
    run.gold = Math.max(0, run.gold - lost);
    run.deaths++;
    sfx.lose();
    emitPhase();
  }

  function retryAct() {
    if (mode !== 'dead') return;
    hero.hp = stats.maxHp;
    hero.mp = stats.maxMp;
    hero.dodgeCd = 0; hero.wwcd = 0; hero.rbcd = 0; hero.ultcd = 0;
    run.potions = Math.max(run.potions, 2);
    phase = 'playing';
    beginAct(run.act);
    toastMsg('从第' + ['一', '一', '二', '三', '四'][run.act] + '幕重新开始');
  }

  /* ============================================================
   * 15. 敌人 AI
   * ============================================================ */
  function updateEnemy(e, dt) {
    if (e.dead) return;
    if (e.flash > 0) e.flash -= dt;
    if (e.hurtT > 0) e.hurtT -= dt;
    if (e.stun > 0) {
      e.stun -= dt;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.vx *= Math.exp(-dt * 6); e.vy *= Math.exp(-dt * 6);
      clampEnemy(e);
      return;
    }
    if (e.state === 'spawn') {
      e.spawnT -= dt;
      if (e.spawnT <= 0) { e.state = 'idle'; e.t = 0; }
      return;
    }
    var spd = e.speed * (e.slowT > 0 ? 0.45 : 1) * (e.enraged ? 1.25 : 1);
    var dx = hero.x - e.x, dy = hero.y - e.y;
    var d = Math.max(1, Math.hypot(dx, dy));
    var ux = dx / d, uy = dy / d;
    e.dir = Math.atan2(uy, ux);
    if (e.slowT > 0) e.slowT -= dt;

    if (e.kind === 'slime') {
      e.t += dt;
      var hop = 0.72 + 0.35 * Math.abs(Math.sin(e.t * 4.5));
      if (d > e.r + 26) moveEnemy(e, ux * spd * hop, uy * spd * hop, dt);
      e.hitCd -= dt;
      if (d < e.r + 26 && e.hitCd <= 0) { damageHero(e.dmg, e.x, e.y); e.hitCd = 1.0; }
    } else if (e.kind === 'archer') {
      if (e.act === 'aim') {
        e.t -= dt;
        if (e.t <= 0) {
          e.act = null; e.cool = 2.2;
          var a = Math.atan2(hero.y - e.y, hero.x - e.x);
          projectiles.push({ x: e.x + Math.cos(a) * 26, y: e.y - 20 + Math.sin(a) * 26, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, r: 7, dmg: e.dmg, life: 2.2, age: 0, color: '#c8b4ff', hostile: true });
          sfx.whiff();
        }
        return;
      }
      if (e.cool > 0) e.cool -= dt;
      if (e.cool <= 0 && d < 520) { e.act = 'aim'; e.t = 0.8; return; }
      // 保持距离
      if (d < 220) moveEnemy(e, -ux * spd, -uy * spd, dt);
      else if (d > 340) moveEnemy(e, ux * spd, uy * spd, dt);
      else moveEnemy(e, -uy * spd * 0.5, ux * spd * 0.5, dt);
    } else if (e.kind === 'charger') {
      if (e.act === 'windup') {
        e.t -= dt;
        if (e.t <= 0) { e.act = 'charge'; e.t = 0.62; e.chargeDir = Math.atan2(hero.y - e.y, hero.x - e.x); }
        return;
      }
      if (e.act === 'charge') {
        e.t -= dt;
        moveEnemy(e, Math.cos(e.chargeDir) * 640, Math.sin(e.chargeDir) * 640, dt);
        if (d < e.r + 34 && e.hitCd <= 0) { damageHero(e.dmg, e.x, e.y); e.hitCd = 0.8; e.act = 'recover'; e.t = 0.7; }
        if (e.t <= 0 || e.x <= ARENA.x0 + 30 || e.x >= ARENA.x1 - 30 || e.y <= ARENA.y0 + 30 || e.y >= ARENA.y1 - 20) {
          e.act = 'recover'; e.t = 0.7;
        }
        return;
      }
      if (e.act === 'recover') { e.t -= dt; if (e.t <= 0) { e.act = null; e.cool = 1.6; } return; }
      if (e.cool > 0) e.cool -= dt;
      if (d < 340 && e.cool <= 0) { e.act = 'windup'; e.t = 0.6; return; }
      if (d > e.r + 40) moveEnemy(e, ux * spd, uy * spd, dt);
      e.hitCd -= dt;
      if (d < e.r + 34 && e.hitCd <= 0) { damageHero(e.dmg * 0.6, e.x, e.y); e.hitCd = 1.2; }
    } else if (e.kind === 'guard') {
      if (e.act === 'windup') {
        e.t -= dt;
        if (e.t <= 0) {
          e.act = null; e.cool = 1.8;
          var ang = Math.atan2(hero.y - e.y, hero.x - e.x);
          var half = 1.0, rr = 112;
          if (dist(hero.x, hero.y, e.x, e.y) < rr && Math.abs(angDiff(Math.atan2(hero.y - e.y, hero.x - e.x), ang)) < half) damageHero(e.dmg, e.x, e.y);
          effects.push({ type: 'slash', x: e.x, y: e.y, dir: ang, r: rr, arc: half * 2, life: 0.22, age: 0, idx: 2, color: '#a86bff' });
          sfx.whiff();
        }
        return;
      }
      if (e.cool > 0) e.cool -= dt;
      if (d < 100 && e.cool <= 0) { e.act = 'windup'; e.t = 0.5; return; }
      if (d > e.r + 30) moveEnemy(e, ux * spd, uy * spd, dt);
      e.hitCd -= dt;
      if (d < e.r + 28 && e.hitCd <= 0) { damageHero(e.dmg * 0.5, e.x, e.y); e.hitCd = 1.4; }
    } else if (e.kind === 'elite' || e.kind === 'warden') {
      updateElite(e, dt, d, ux, uy, spd);
    } else if (e.kind === 'boss') {
      updateBoss(e, dt, d, ux, uy, spd);
    }
  }

  function moveEnemy(e, vx, vy, dt) {
    e.vx = lerp(e.vx, vx, 1 - Math.exp(-dt * 8));
    e.vy = lerp(e.vy, vy, 1 - Math.exp(-dt * 8));
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    clampEnemy(e);
  }

  function clampEnemy(e) {
    var mX = Math.max(e.r, e.size * 0.42);
    var mY = Math.max(e.r, e.size * 0.3);
    e.x = clamp(e.x, ARENA.x0 + mX, ARENA.x1 - mX);
    e.y = clamp(e.y, ARENA.y0 + mY, ARENA.y1 - e.r * 0.6);
    collideWalls(e, e.r * 0.72);
  }

  /* 第三幕的矩形墙：圆 vs 轴对齐矩形，把实体推出去 */
  function collideWalls(o, r) {
    if (!room || !room.walls.length) return;
    for (var i = 0; i < room.walls.length; i++) {
      var w = room.walls[i];
      var cx = clamp(o.x, w[0], w[0] + w[2]);
      var cy = clamp(o.y, w[1], w[1] + w[3]);
      var dx = o.x - cx, dy = o.y - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      if (d2 > 0.0001) {
        var d = Math.sqrt(d2);
        o.x = cx + dx / d * r;
        o.y = cy + dy / d * r;
      } else {
        var left = o.x - w[0], right = w[0] + w[2] - o.x;
        var top = o.y - w[1], bottom = w[1] + w[3] - o.y;
        var m = Math.min(left, right, top, bottom);
        if (m === left) o.x = w[0] - r;
        else if (m === right) o.x = w[0] + w[2] + r;
        else if (m === top) o.y = w[1] - r;
        else o.y = w[1] + w[3] + r;
      }
    }
  }

  function pointInWalls(x, y, pad) {
    if (!room || !room.walls.length) return false;
    for (var i = 0; i < room.walls.length; i++) {
      var w = room.walls[i];
      if (x > w[0] - pad && x < w[0] + w[2] + pad && y > w[1] - pad && y < w[1] + w[3] + pad) return true;
    }
    return false;
  }

  function updateElite(e, dt, d, ux, uy, spd) {
    if (!e.enraged && e.hp < e.maxHp * 0.5) {
      e.enraged = true;
      e.dmg *= 1.2;
      banner = { text: '典狱官 · 狂暴', sub: '烈焰新星更频繁了', t: 0, life: 2.4 };
      effects.push({ type: 'ring', x: e.x, y: e.y, r: 20, max: 240, life: 0.6, age: 0, color: '#ff6b3d' });
      sfx.boss();
    }
    if (e.kind === 'warden' && e.act === null && e.cool <= 0 && d > 300 && Math.random() < 0.6) {
      // 虚空突进
      effects.push({ type: 'ring', x: e.x, y: e.y, r: 10, max: 90, life: 0.4, age: 0, color: '#8fd0ff' });
      e.x = clamp(hero.x + Math.cos(e.dir + 2.4) * 220, ARENA.x0 + 60, ARENA.x1 - 60);
      e.y = clamp(hero.y + Math.sin(e.dir + 2.4) * 220, ARENA.y0 + 60, ARENA.y1 - 60);
      effects.push({ type: 'ring', x: e.x, y: e.y, r: 10, max: 90, life: 0.4, age: 0, color: '#8fd0ff' });
      e.cool = 2.5;
      return;
    }
    if (e.act === 'nova') {
      e.t -= dt;
      if (e.t <= 0) {
        e.act = null; e.cool = e.enraged ? 3.4 : 5.5;
        var rad = 250;
        if (dist(hero.x, hero.y, e.x, e.y) < rad) damageHero(e.dmg * 1.2, e.x, e.y);
        effects.push({ type: 'ring', x: e.x, y: e.y, r: 20, max: rad, life: 0.5, age: 0, color: '#ff8a4a' });
        for (var i = 0; i < 22; i++) {
          var a = (i / 22) * TAU;
          effects.push({ type: 'spark', x: e.x, y: e.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.5, age: 0, color: '#ff8a4a' });
        }
        sfx.boss();
      }
      return;
    }
    if (e.act === 'windup') {
      e.t -= dt;
      if (e.t <= 0) {
        e.act = null; e.cool = 1.6;
        var ang = Math.atan2(hero.y - e.y, hero.x - e.x);
        var rr = 130;
        if (dist(hero.x, hero.y, e.x, e.y) < rr && Math.abs(angDiff(Math.atan2(hero.y - e.y, hero.x - e.x), ang)) < 1.1) damageHero(e.dmg, e.x, e.y);
        effects.push({ type: 'slash', x: e.x, y: e.y, dir: ang, r: rr, arc: 2.2, life: 0.26, age: 0, idx: 2, color: '#ff8a4a' });
        sfx.whiff();
      }
      return;
    }
    if (e.cool > 0) e.cool -= dt;
    if (e.cool <= 0 && d < 260) { e.act = 'nova'; e.t = 0.9; return; }
    if (d < 116) { e.act = 'windup'; e.t = 0.55; return; }
    moveEnemy(e, ux * spd, uy * spd, dt);
    e.hitCd -= dt;
    if (d < e.r + 30 && e.hitCd <= 0) { damageHero(e.dmg * 0.5, e.x, e.y); e.hitCd = 1.3; }
    if (e.kind === 'warden' && e.act === null && e.shootCd === undefined) e.shootCd = 3;
    if (e.kind === 'warden') {
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = 4.2;
        for (var s = -2; s <= 2; s++) {
          var a2 = e.dir + s * 0.24;
          projectiles.push({ x: e.x, y: e.y - 30, vx: Math.cos(a2) * 300, vy: Math.sin(a2) * 300, r: 8, dmg: e.dmg * 0.7, life: 2.4, age: 0, color: '#8fd0ff', hostile: true });
        }
      }
    }
  }

  /* ============================================================
   * 16. Boss 卡奥斯：三阶段 · 90 秒狂暴 · 技能池轮换
   * ============================================================ */
  function updateBoss(e, dt, d, ux, uy, spd) {
    if (room.fightTime > R.bossEnrage && !e.enraged) {
      e.enraged = true;
      e.dmg *= 1.5;
      banner = { text: '卡奥斯 · 狂暴', sub: '星辉核心在燃烧', t: 0, life: 3 };
      flashWhite = 0.3; shake = 20;
      sfx.boss();
    }
    if (e.act === 'phase') {
      e.t -= dt;
      if (e.t <= 0) { e.act = null; e.cool = 0.5; }
      return;
    }
    if (e.act === 'slash3') {
      e.t -= dt;
      if (e.t <= 0) {
        e.slashCount = (e.slashCount || 0) + 1;
        var ang = Math.atan2(hero.y - e.y, hero.x - e.x);
        if (e.slashCount > 1) ang += rnd(-0.5, 0.5);
        e.face = ang;
        var rr = 168;
        if (dist(hero.x, hero.y, e.x, e.y) < rr && Math.abs(angDiff(Math.atan2(hero.y - e.y, hero.x - e.x), ang)) < 1.35) damageHero(e.dmg * 1.1, e.x, e.y);
        effects.push({ type: 'slash', x: e.x, y: e.y, dir: ang, r: rr, arc: 2.6, life: 0.3, age: 0, idx: 2, color: '#ff6b6b' });
        shake = Math.max(shake, 8);
        sfx.whiff();
        if (e.slashCount >= 3) { e.act = 'recover'; e.t = 0.5; e.slashCount = 0; }
        else e.t = 0.62;
      }
      return;
    }
    if (e.act === 'dashWind') {
      e.t -= dt;
      if (e.t <= 0) { e.act = 'dash'; e.t = 0.5; e.chargeDir = Math.atan2(hero.y - e.y, hero.x - e.x); e.hitSet = false; }
      return;
    }
    if (e.act === 'dash') {
      e.t -= dt;
      e.x += Math.cos(e.chargeDir) * 900 * dt;
      e.y += Math.sin(e.chargeDir) * 900 * dt;
      clampEnemy(e);
      if (dist(hero.x, hero.y, e.x, e.y) < 90 && !e.hitSet) { damageHero(e.dmg * 1.4, e.x, e.y); e.hitSet = true; }
      effects.push({ type: 'spark', x: e.x, y: e.y, vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.3, age: 0, color: '#ff8a4a' });
      if (e.t <= 0) { e.act = 'recover'; e.t = 0.6; }
      return;
    }
    if (e.act === 'barrage') {
      e.t -= dt;
      if (e.t <= 0) {
        e.shotCount = (e.shotCount || 0) + 1;
        var n = 9 + e.phase * 2;
        for (var i = 0; i < n; i++) {
          var a = (i / n) * TAU + e.shotCount * 0.25;
          projectiles.push({ x: e.x, y: e.y - 30, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 8, dmg: e.dmg * 0.65, life: 3, age: 0, color: '#c8a4ff', hostile: true });
        }
        sfx.whiff();
        if (e.shotCount >= 3) { e.act = 'recover'; e.t = 0.7; e.shotCount = 0; }
        else e.t = 0.45;
      }
      return;
    }
    if (e.act === 'summon') {
      e.t -= dt;
      if (e.t <= 0) {
        e.act = 'recover'; e.t = 0.8;
        for (var k = 0; k < 3; k++) {
          var pos = spawnPos(k, 3);
          var s = spawnEnemy('slime', pos.x, pos.y);
          if (s) { s.hp = s.maxHp = Math.round(s.maxHp * 0.8); }
        }
        sfx.boss();
      }
      return;
    }
    if (e.act === 'nova') {
      e.t -= dt;
      if (e.t <= 0) {
        e.act = 'recover'; e.t = 0.8;
        if (dist(hero.x, hero.y, e.x, e.y) < 320) damageHero(e.dmg * 1.2, e.x, e.y);
        effects.push({ type: 'ring', x: e.x, y: e.y, r: 20, max: 340, life: 0.55, age: 0, color: '#ff6b6b' });
        shake = 14;
        sfx.boss();
      }
      return;
    }
    if (e.act === 'recover') {
      e.t -= dt;
      if (e.t <= 0) { e.act = null; e.cool = Math.max(0.55, 1.3 - e.phase * 0.2); }
      return;
    }
    if (e.cool > 0) e.cool -= dt;
    if (e.cool <= 0) {
      var opts = ['slash3', 'dash', 'barrage', 'nova'];
      if (e.phase >= 2) opts.push('summon', 'barrage', 'slash3');
      if (e.phase >= 3) opts.push('nova', 'dash');
      var choice = pick(opts);
      if (choice === 'dash') { e.act = 'dashWind'; e.t = 0.8; }
      else if (choice === 'barrage') { e.act = 'barrage'; e.t = 0.4; e.shotCount = 0; }
      else if (choice === 'summon') { e.act = 'summon'; e.t = 0.7; }
      else if (choice === 'nova') { e.act = 'nova'; e.t = 1.0; }
      else { e.act = 'slash3'; e.t = 0.55; e.slashCount = 0; }
      return;
    }
    if (d > 150) moveEnemy(e, ux * spd, uy * spd, dt);
    e.hitCd -= dt;
    if (d < 130 && e.hitCd <= 0) { damageHero(e.dmg * 0.6, e.x, e.y); e.hitCd = 1.2; }
  }

  function bossPhaseCheck(e) {
    var pct = e.hp / e.maxHp;
    var want = pct > 0.5 ? 1 : (pct > 0.25 ? 2 : 3);
    if (want > e.phase) {

    if (vignettePulse > 0) vignettePulse = Math.max(0, vignettePulse - rdt * 1.6);
    if (pushX !== 0 || pushY !== 0) {
      pushX *= Math.exp(-rdt * 14); pushY *= Math.exp(-rdt * 14);
      if (Math.abs(pushX) < 0.2) pushX = 0;
      if (Math.abs(pushY) < 0.2) pushY = 0;
    }
    if (shake > 0) shake = Math.max(0, shake - rdt * 42);

    if (mode === 'title') return;

    var ts = 1;
    if (slowmo > 0) { slowmo -= rdt; ts = 0.32; }
    var dt = rdt * ts;
    if (hitstop > 0) { hitstop -= rdt; dt *= 0.02; }

    updateEffects(dt);
    updateFloaters(rdt);
    updateDrops(dt);

    if (mode === 'room') {
      runTime += dt;
      if (room) {
        room.intro += dt;
        if (room.type === 'boss') room.fightTime += dt;
      }
      updateHero(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateHazards(dt);
      updateRoomFlow(dt);

    }

    }

  function updateHero(dt) {

    if (hero.dodgeWindow > 0) hero.dodgeWindow -= dt;
    if (hero.dodgeCd > 0) hero.dodgeCd -= dt;
    if (hero.wwcd > 0) hero.wwcd -= dt;
    if (hero.rbcd > 0) hero.rbcd -= dt;
    if (hero.ultcd > 0) hero.ultcd -= dt;
    if (hero.potionCd > 0) hero.potionCd -= dt;
    if (hero.comboTimer > 0) hero.comboTimer -= dt;
    if (hero.critNext > 0) hero.critNext -= dt;
    if (hero.guard) hero.guardT += dt; else hero.guardT = 0;

    // 闪避残影：疾跑中每隔 45ms 留一道约 0.24s 淡出的分身

      hero.ghostT = (hero.ghostT || 0) - dt;
      if (hero.ghostT <= 0) {
        hero.ghostT = 0.045;
        ghosts.push({ x: hero.x, y: hero.y, flip: Math.cos(hero.face) < 0, age: 0, life: 0.24 });

    // 法力与生命回复
    hero.mp = Math.min(stats.maxMp, hero.mp + stats.mpRegen * dt);
    if (stats.regen > 0) hero.hp = Math.min(stats.maxHp, hero.hp + stats.regen * dt);

    var mx = 0, my = 0;
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright'] || keys['d']) mx += 1;
    if (keys['arrowup'] || keys['w']) my -= 1;
    if (keys['arrowdown'] || keys['s']) my += 1;
    if (joystick) {
      var jd = Math.hypot(joystick.dx, joystick.dy);
      if (jd > 12) { mx += joystick.dx / jd; my += joystick.dy / jd; }
    }
    if (autoOn) { mx += autoIntent.x; my += autoIntent.y; }
    mx += padState.x;
    my += padState.y;
    var ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }

    if (hero.dodge > 0) {
      hero.dodge -= dt;
      var dsp = stats.dodgeDist / 0.22;
      hero.vx = Math.cos(hero.dodgeDir) * dsp;
      hero.vy = Math.sin(hero.dodgeDir) * dsp;
      if (hero.dodge <= 0) { hero.vx *= 0.3; hero.vy *= 0.3; }

      hero.vy = lerp(hero.vy, my * spd, acc);
      if (ml > 0.1 && hero.atkTimer <= 0) hero.face = Math.atan2(my, mx);
    }

    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;
    hero.x = clamp(hero.x, ARENA.x0 + 22, ARENA.x1 - 22);
    hero.y = clamp(hero.y, ARENA.y0 + 40, ARENA.y1 - 8);
    collideWalls(hero, 15);
    hero.walk += Math.hypot(hero.vx, hero.vy) * dt * 0.03;

    // 普攻
    if (hero.atkTimer > 0) {
      hero.atkTimer -= dt;
      var elapsed = hero.atkDur - hero.atkTimer;
      if (!hero.atkHit && elapsed >= 0.085) { hero.atkHit = true; performSwing(); }
      if (hero.atkTimer <= 0) { hero.atkTimer = 0; }
    }
    // 旋风斩
    if (hero.ww > 0) {
      hero.ww -= dt;
      hero.wwTick -= dt;
      if (hero.wwTick <= 0) {
        hero.wwTick = 0.12;
        whirlwindTick();
        if (stats.wwExtend && Math.random() < 0.35) hero.ww = Math.min(hero.ww + 0.12, 1.2);
      }
      if (hero.ww <= 0) hero.ww = 0;
    }
    // 站上火堆

  }

  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead) updateEnemy(enemies[i], dt);

      var ea = enemies[a];

      for (var b = a + 1; b < enemies.length; b++) {
        var eb = enemies[b];
        if (eb.dead) continue;
        var dx = eb.x - ea.x, dy = eb.y - ea.y;
        var d = Math.hypot(dx, dy);
        var minD = (ea.r + eb.r) * 0.85;
        if (d > 0.001 && d < minD) {

          var nx = dx / d, ny = dy / d;
          ea.x -= nx * push; ea.y -= ny * push;
          eb.x += nx * push; eb.y += ny * push;

    for (var j = 0; j < enemies.length; j++) {
      if (enemies[j].dead) continue;
      clampEnemy(enemies[j]);
    }
    var changed = false;
    for (var k = enemies.length - 1; k >= 0; k--) {

    }

  }

  function updateProjectiles(dt) {

        projectiles.splice(i, 1);

  function updateHazards(dt) {

  function updateDrops(dt) {

  function updateEffects(dt) {

  function gatherAutoIntent(dt) {

            autoIntent.x = px; autoIntent.y = py;
